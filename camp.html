<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tg.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0a0c}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* the Telegram build is always the phone layout: no device frame, no design notes */
.stage{display:block!important;height:100%!important;min-height:0!important;padding:0!important}
.device{width:100%!important;height:100%!important;aspect-ratio:auto!important;padding:0!important;border-radius:0!important;box-shadow:none!important}
.app{border-radius:0!important}
.statusbar,.homebar,.notes{display:none!important}
/* in full screen, stay clear of the phone's status bar and Telegram's own buttons */
:root{--tg-top:calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));--tg-bottom:var(--tg-safe-area-inset-bottom, 0px)}
.top{padding-top:calc(var(--tg-top) + 10px)!important}
.bottom{padding-bottom:calc(var(--tg-bottom) + 10px)!important}
.topbar{padding-top:calc(var(--tg-top) + 8px)!important}
.tabbar{padding-bottom:calc(var(--tg-bottom) + 8px)!important}
.sheet{padding-bottom:calc(var(--tg-bottom) + 16px)!important}
</style>
</head>
<body>
<meta charset="utf-8">
<title>Game Y Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = phone frame with design notes beside it; phone = the app itself, edge to edge.
   Camp, as an experienced player sees it: top bar / scrolling view / tab bar Play · Camp · Almanac · Shop, as in state 1.
   The alchemy table (recipes, free fusion, feeding) is a sub-screen; weapon, gear, creature, item and floor-star cards open as bottom sheets.
   Same single dark world and palette as the other states; sprites 16×16. */
:root{
  --stage:#0c0a0d;
  --bg:#141216;
  --panel:#201c22;
  --panel-hi:#29232b;
  --seg:#2c262d;
  --well:#0e0c10;
  --line:#3a3238;
  --fg:#ece3d2;
  --muted:#9d929a;
  --torch:#e2b24c;
  --torch-dim:#5b4524;
  --torch-ink:#1a1209;
  --blood:#cf4656;
  --moss:#7fa48a;
  --moss-dim:#26332b;
  --arcane:#8f7ad1;
  --gem:#c9bdf2;
  --ember:#d98a3d;
  --star:#f3d36b;
  --star-dim:#6a5a2a;
  --scrim:rgba(20,18,22,.95);
  --scrim-mid:rgba(20,18,22,.7);
  --veil:rgba(8,6,9,.6);
  --glow:rgba(226,178,76,.07);
  --glow-soft:rgba(226,178,76,.14);
  --glow-strong:rgba(226,178,76,.28);
  --pulse:rgba(226,178,76,.55);
  --pulse-0:rgba(226,178,76,0);
  --shadow:rgba(0,0,0,.5);
  --ink:#000;
  --stone:#2a2529;
  --slot:#161317;
  --wood:#4a3020;
  --wood-hi:#6e4426;
  --wood-lo:#2a1a10;
  --bevel-hi:rgba(255,255,255,.12);
  --bevel-lo:rgba(0,0,0,.6);
  --hover:rgba(255,255,255,.22);
  --tip:rgba(16,0,16,.94);
  --tip-edge:#4b1fa8;
  --bezel:#050406;
  --bezel-edge:#2c262e;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{font-variant-ligatures:none!important}   /* Pixelify Sans turns "fl" into a broken glyph; !important because every font shorthand resets it */
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.num{font-family:var(--body);font-variant-numeric:tabular-nums}   /* digits in Golos: Pixelify's small 2 and 5 read as 8 and S */

/* ---------- stage & device (same as the other states) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:radial-gradient(60% 55% at 50% 45%, var(--glow), transparent 70%)}
.device{position:relative;flex:none;height:clamp(640px, calc(100vh - 48px), 864px);height:clamp(640px, calc(100dvh - 48px), 864px);aspect-ratio:410/864;padding:10px;border-radius:58px;background:var(--bezel);box-shadow:0 0 0 1px var(--bezel-edge), 0 40px 90px -30px var(--bezel)}
.app{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{flex:none;position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 36px;font:600 15px/1 var(--body);color:var(--fg)}
.island{position:absolute;top:11px;left:50%;width:118px;height:33px;margin-left:-59px;border-radius:17px;background:var(--bezel)}
.sys{display:flex;gap:6px;align-items:center}
.sys svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;z-index:30;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.75;pointer-events:none}

/* ---------- top bar: hero and purse, as in 01 ---------- */
.topbar{flex:none;padding-block:6px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--bg)}
.tb-root{display:flex;align-items:center;gap:12px;min-height:42px}
.hero{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{flex:none;width:42px;height:42px;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:auto}   /* painted face from art/ari-torch.jpg, as in 01 */
.who{min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font:500 17px/1.1 var(--display)}
.who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.purse{flex:none;display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px 0 6px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:600 14px/1 var(--body);font-variant-numeric:tabular-nums}
.chip img{width:16px;height:16px}
.chip.coins{color:var(--torch)}
.chip.gems{padding-right:3px;color:var(--gem);cursor:pointer}   /* the + opens the crystal packs in the shop (GDE-05) */
.chip .plus{width:20px;height:20px;display:grid;place-items:center;margin-left:2px;border-radius:10px;background:var(--arcane);color:var(--torch-ink)}
.chip .plus .ico{width:8px;height:8px}
.tb-sub{display:flex;align-items:center;gap:12px;min-height:42px}
.back{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.back .ico{width:16px;height:14px}
.tb-title{min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-title b{font:500 18px/1.1 var(--display)}
.tb-title span{font-size:12px;color:var(--muted)}

/* ---------- views ---------- */
.main{position:relative;flex:1;min-height:0;display:flex}
.views{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:12px;padding-block:16px 24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.view.fwd{animation:fwd .22s ease-out}
.view.rev{animation:rev .22s ease-out}
@keyframes fwd{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes rev{from{opacity:.3;transform:translateX(-14px)}to{opacity:1;transform:none}}
.vh{display:flex;flex-direction:column;gap:4px;padding-bottom:2px}
.vh h2{margin:0;font:700 26px/1.05 var(--display)}
.sec{margin:8px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec span{font:400 12px/1 var(--body);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;background:currentColor;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border:0;border-radius:4px;background:var(--torch);color:var(--torch-ink);font:500 17px/1 var(--display);cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:15px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.off{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.btn .ico{width:12px;height:12px}
.btn .cost{display:inline-flex;align-items:center;gap:3px;font:600 14px/1 var(--body)}
.btn .cost .ico{width:10px;height:10px}
.btn.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pulse)}100%{box-shadow:0 0 0 14px var(--pulse-0)}}
.btn:not(.off):active,.tile:active,.rowcard:active,button.entry:active,button.cell:active,.where:active,.back:active,.lrow:not(.on):active,.tgt:active,.fstars:active,.hcard:active,.dslot:active,.rct:active,.mv:active,.chip.gems:active{transform:translateY(1px)}
.shake{animation:shake .32s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

/* ★ tiers and levels, as on the weapon screen (06): stars = tier, the fraction = level / the tier's cap */
.stars{font-size:13px;letter-spacing:1px;color:var(--star);white-space:nowrap}
.stars i{font-style:normal;color:var(--star-dim)}
.lv{font:600 14px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv small{font-size:12px;font-weight:400;color:var(--muted)}
.lv.up{animation:lvup .6s ease-out}
@keyframes lvup{0%{color:var(--torch);transform:scale(1.25)}100%{color:inherit;transform:none}}
.xbar{position:relative;height:6px;background:var(--well);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.xbar i,.xbar u{position:absolute;top:0;bottom:0;display:block}
.xbar i{left:0;background:var(--arcane)}
.xbar u{background:var(--torch);opacity:.6;text-decoration:none}   /* what the chosen food will add */
.xbar.max i{background:var(--torch)}

/* ---------- camp: scene strip (pixel art, 3 screen px per art px) ---------- */
.strip{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;width:100%;min-height:148px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background-color:var(--panel);background-repeat:no-repeat;background-position:right bottom;image-rendering:pixelated;overflow:hidden}
.strip::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, var(--scrim) 0%, var(--scrim) 22%, var(--scrim-mid) 40%, transparent 62%)}
.strip>*{position:relative}
.strip .eyebrow{font:500 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.strip .title{font:700 25px/1.05 var(--display);margin-top:2px}
.strip .meta{font-size:13px;color:var(--muted)}
.fstars{display:flex;gap:4px;margin-top:4px;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:var(--scrim-mid);cursor:pointer}   /* the floor's three stars; a tap shows the conditions */
.fstars .ico{width:14px;height:14px;color:var(--star-dim)}
.fstars .ico.on{color:var(--star)}

/* the weapon in hand (its sheet): tier, level, Feed and Ascend */
.wrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* tiles: the table */
.tile{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.tface{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;background:var(--seg);color:var(--fg)}
.tface .ico{width:26px;height:26px}
.tbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.tbody b{font:500 18px/1.1 var(--display)}
.outs{display:flex;gap:2px;min-height:32px}   /* what can be made right now, as icons */
.outs img{width:32px;height:32px}
.badge{min-width:24px;height:24px;padding:0 7px;display:grid;place-items:center;border-radius:12px;background:var(--blood);color:var(--fg);font:600 13px/1 var(--body);font-variant-numeric:tabular-nums}
.chev{width:10px;height:14px;color:var(--muted)}
.pill{flex:none;padding:5px 7px;border-radius:3px;font:500 12px/1 var(--display);letter-spacing:.06em;white-space:nowrap}
.pill.new{background:var(--torch-dim);color:var(--torch)}
.pill.ok{background:var(--moss-dim);color:var(--moss)}
.pill.off{background:var(--seg);color:var(--muted)}

/* heroes: a card per hero the player has, the pixel skin at 2× over its shadow, name below; the torch marks who goes to the next floor */
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hcard{position:relative;min-width:0;display:flex;flex-direction:column;gap:7px;padding:10px 8px 9px;border:1px solid var(--line);border-radius:6px;background:radial-gradient(60% 42% at 50% 38%, var(--glow-soft), transparent 75%), var(--well);overflow:hidden;color:var(--fg);text-decoration:none;cursor:pointer}
.hcard.on{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch), 0 0 18px var(--glow-soft)}
.hsk{position:relative;height:128px;display:flex;align-items:flex-end;justify-content:center}
.hsk::after{content:"";position:absolute;left:50%;bottom:0;width:64px;height:7px;margin-left:-32px;border-radius:50%;background:var(--shadow)}   /* the floor under the feet */
.hsk img{position:relative;z-index:1;width:96px;height:128px;image-rendering:pixelated}   /* a 48×64 skin at 2× */
.hsk img.paint{width:100%;height:100%;object-fit:cover;object-position:50% 20%;image-rendering:auto;border-radius:4px}   /* no skin file: the painted bust */
.hname{display:flex;flex-direction:column;gap:3px;text-align:left}
.hname b{font:500 15px/1.1 var(--display)}
.hname span{display:flex;align-items:center;gap:5px;font:500 11px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.hname .stars,.bwho .stars{color:var(--star)}
.hname .stars{font-size:9px;letter-spacing:0}
.torch{position:absolute;top:6px;left:6px;z-index:2;width:22px;height:22px;display:grid;place-items:center;border-radius:3px;background:var(--torch);color:var(--torch-ink)}
.torch .ico{width:10px;height:10px}
.hcard.free{display:grid;place-items:center;border-style:dashed;background:transparent;color:var(--muted)}
.hcard.free .ico{width:18px;height:18px}
/* a hero's build as a paper doll: the full-height skin in the middle, gear on both sides */
.bwho{display:flex;flex-direction:column;gap:6px}
.bwho b{font:700 25px/1.05 var(--display)}
.bwho span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.doll{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:12px 8px;align-items:center;padding:16px 12px 14px;border:1px solid var(--line);border-radius:6px;background:radial-gradient(45% 50% at 50% 42%, var(--glow-soft), transparent 75%), var(--well)}
.dcol{display:flex;flex-direction:column;gap:10px}
.dslot{position:relative;width:64px;height:64px;display:grid;place-items:center;padding:0;border:0;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bevel-lo), inset -2px -2px 0 var(--bevel-hi);cursor:pointer}   /* bevelled, as the bag */
.dslot img{width:32px;height:32px}
.dslot .wl{position:absolute;left:3px;right:3px;bottom:3px;padding:1px 0;background:var(--veil);font:600 10px/1.2 var(--body);font-variant-numeric:tabular-nums;color:var(--fg);text-align:center;pointer-events:none}   /* the weapon's level */
.skinbox{position:relative;height:212px;display:flex;align-items:flex-end;justify-content:center}
.skinbox::after{content:"";position:absolute;left:50%;bottom:2px;width:96px;height:10px;margin-left:-48px;border-radius:50%;background:var(--shadow)}   /* the floor under the feet */
.skinbox img{position:relative;z-index:1;height:192px;width:auto;image-rendering:pixelated}   /* 48×64 or 64×96 skins: whole-number scale */
.skinbox img.paint{height:100%;width:100%;object-fit:cover;object-position:50% 20%;image-rendering:auto;border-radius:4px;-webkit-mask-image:linear-gradient(180deg, #000 72%, transparent);mask-image:linear-gradient(180deg, #000 72%, transparent)}   /* until the pixel skins exist: the painted bust */
.skinbox .torch{top:0;left:0}
/* under the doll: race and class, the hero's level, stats, the four moves in battle */
.rc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rct{min-width:0;display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.rct .lbl{font:500 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rct b{font:500 17px/1.1 var(--display)}
.rct .sub{display:flex;align-items:center;gap:5px;min-height:14px;font-size:12px;color:var(--muted)}
.rct .sub .ico{width:10px;height:10px}
.hlv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:0 2px}
.hlv b{font:500 16px/1 var(--display)}
.hlv span{font:500 12px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
.stats{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;border:1px solid var(--line);border-radius:6px;background:var(--line);overflow:hidden}
.stats div{display:flex;flex-direction:column;gap:5px;padding:9px 10px;background:var(--panel)}
.stats dt{font-size:11px;color:var(--muted)}
.stats dd{margin:0;font:600 16px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats dd small{margin-left:5px;font-size:11px;font-weight:500;color:var(--muted)}   /* what the gear adds, as in 07 */
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mv{min-width:0;min-height:50px;display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px 8px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.mv img{width:32px;height:32px}
.mv b{min-width:0;font:500 14px/1.15 var(--display)}
.mv.free{border-style:dashed;background:transparent;color:var(--muted)}
.mv.free .ico{width:12px;height:12px;justify-self:center}
/* a class's skill tree: a tab per class (two at most), rows by class level, a core in the middle, two subclass branches from Lv 5 */
.seg button.locked{color:var(--line)}
.seg button.locked .ico{width:10px;height:10px}
.pts{color:var(--torch)}
.tree{position:relative;margin-top:2px}
.tlines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tlines line{stroke:var(--line);stroke-width:2;vector-effect:non-scaling-stroke}
.tlines line.lit{stroke:var(--torch-dim)}
.trow{position:absolute;left:0;right:0;border-top:1px dashed var(--seg)}
.trow span{position:absolute;left:0;top:5px;display:flex;align-items:center;gap:4px;font:500 11px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
.trow.off span{color:var(--line)}
.trow .ico{width:8px;height:8px}
.tnode{position:absolute;z-index:1;width:52px;height:52px;margin:-26px 0 0 -26px;display:grid;place-items:center;padding:0;border:0;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bevel-lo), inset -2px -2px 0 var(--bevel-hi);cursor:pointer}
.tnode img{width:32px;height:32px}
.tnode .rk{position:absolute;left:3px;right:3px;bottom:3px;padding:1px 0;background:var(--veil);font:600 10px/1.2 var(--body);font-variant-numeric:tabular-nums;color:var(--fg);text-align:center;pointer-events:none}
.tnode.got{box-shadow:inset 0 0 0 2px var(--torch-dim), inset 2px 2px 0 2px var(--bevel-lo)}
.tnode.max{box-shadow:inset 0 0 0 2px var(--torch), inset 2px 2px 0 2px var(--bevel-lo)}
.tnode.can{outline:2px solid var(--torch);outline-offset:-2px;animation:pulse 1.6s ease-out infinite}   /* a point can go here; the pulse animates box-shadow, so the frame is an outline */
.tnode.lock img,.tnode.dim img{opacity:.45}
.tnode.closed{opacity:.3}   /* the other subclass's branch */
.ndesc{margin:0;font-size:14px;color:var(--fg)}


/* shelf: special and quest items stand on a plank */
.shelf{position:relative;display:flex;gap:8px;padding:8px 12px 0;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg, var(--panel) 0%, var(--panel) calc(100% - 12px), var(--wood-hi) calc(100% - 12px), var(--wood-hi) calc(100% - 10px), var(--wood) calc(100% - 10px), var(--wood-lo) 100%)}

.shelf .islot.empty{background:transparent;box-shadow:none;border:1px dashed var(--line)}


/* ---------- table ---------- */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;border:0;border-radius:4px;background:transparent;color:var(--muted);font:500 14px/1 var(--display);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel-hi);color:var(--torch)}
.seg .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;background:var(--torch)}

.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rec.can{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch), 0 0 18px var(--glow-soft)}
.rec[data-rec]{cursor:pointer}

.rec.sil{background:transparent;border-style:dashed}
.rec.sil b{color:var(--muted);letter-spacing:.1em}
.face{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:4px;background:var(--seg);font:700 20px/1 var(--display);color:var(--line)}

.rec.sil .face{background:transparent;border:1px dashed var(--line)}
.rbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.rbody b{display:flex;align-items:center;gap:8px;font:500 16px/1.15 var(--display)}
.rbody p{margin:0;font-size:13px;color:var(--muted)}
.tagnew{padding:3px 5px;border-radius:3px;background:var(--torch-dim);color:var(--torch);font:500 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.ings{display:flex;flex-wrap:wrap;gap:4px 10px}
.ing{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.ing img{width:16px;height:16px}
.ing i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--blood)}
.ing.ok i{color:var(--moss)}
.wheres{display:flex;flex-wrap:wrap;gap:6px}
.where{display:inline-flex;align-items:center;gap:5px;padding:3px 7px 3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--seg);color:var(--fg);font:500 12px/1 var(--body);font-variant-numeric:tabular-nums;cursor:pointer}   /* who drops the missing piece, and where */
.where img{width:16px;height:16px}
.clue{display:flex;align-items:center;gap:6px;font:500 15px/1 var(--display);color:var(--muted)}
.clue img{width:20px;height:20px}
.known{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.krow img{width:20px;height:20px}
.krow .op{margin:0;font-size:13px;color:var(--muted)}
.krow b{margin-left:4px;font:500 14px/1.1 var(--display)}

/* free fusion: two cells and the result, as at the run's table */
.bench{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:4px;align-items:start;padding:14px 8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.part{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.cell{position:relative;width:60px;height:60px;max-width:100%;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--well);font:700 22px/1 var(--display);color:var(--line)}
button.cell{cursor:pointer}
.cell img:not(.n){width:40px;height:40px}
.cell .n{position:absolute;right:3px;bottom:3px}
.cell.empty{border-style:dashed;background:transparent}
.cell.dim img{opacity:.4}
.part.res .cell{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch)}
.part.res.done .cell{box-shadow:inset 0 0 0 1px var(--torch), 0 0 22px var(--glow-strong)}
.part b{min-height:15px;font:500 13px/1.15 var(--display)}
.op{margin-top:20px;font:700 20px/1 var(--display);color:var(--muted)}
.tablerow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.tablenote{font:500 15px/1.2 var(--display)}
.tablenote.bad{color:var(--blood)}
.tablenote.good{color:var(--torch)}
/* dragging from the bag onto the table, as in the run */
.dragicon{position:absolute;z-index:23;width:48px;height:48px;margin:-24px 0 0 -24px;pointer-events:none;filter:drop-shadow(0 6px 6px var(--ink))}
.bench.drop .cell[data-spot]{border-style:dashed;border-color:var(--torch)}
.cell.over{background:var(--panel-hi);box-shadow:0 0 0 2px var(--torch)}

/* feeding: the weapon to feed, its bar with the gain, food from the bag */
.tgts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tgt{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.tgt img{width:32px;height:32px}
.tgt[aria-pressed="true"]{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch);background:var(--panel-hi)}
.tgt .lv{font-size:12px}
.tierbox{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.tierbox b{font:500 17px/1.1 var(--display)}

/* bag: a Minecraft-style inventory, as in Builds: bevelled slots on a stone panel, stack counts in pixel digits, a purple tooltip */
.inv{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;border:1px solid var(--ink);background:var(--stone);box-shadow:inset 2px 2px 0 var(--bevel-hi), inset -2px -2px 0 var(--bevel-lo)}
.islot{position:relative;min-width:0;aspect-ratio:1/1;display:grid;place-items:center;padding:0;border:0;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bevel-lo), inset -2px -2px 0 var(--bevel-hi)}
button.islot{cursor:pointer;touch-action:none}   /* a drag from the bag must not scroll the view */
.islot img{pointer-events:none}   /* no native image drag on desktop */
.islot.fit{z-index:1}
.islot.fit::before{content:"";position:absolute;inset:0;border:2px solid var(--torch);background:var(--glow-strong);animation:pulse 1.6s ease-out infinite;pointer-events:none}   /* the shown recipe's ingredients, as the run's fitting items */
.islot img:not(.n){width:32px;max-width:66%;height:auto}
.islot .n{position:absolute;right:3px;bottom:3px}
.islot[aria-pressed="true"]::after{content:"";position:absolute;inset:2px;background:var(--hover)}
.islot.used img:not(.n){opacity:.25}
.islot.hand{box-shadow:inset 0 0 0 2px var(--torch), inset 2px 2px 0 2px var(--bevel-lo)}
.islot.picked{box-shadow:inset 0 0 0 2px var(--torch), inset 2px 2px 0 2px var(--bevel-lo)}
.islot[disabled]{cursor:default}
.islot[disabled] img:not(.n){opacity:.3}
.islot .hl{position:absolute;top:4px;left:0;right:0;font:500 9px/1 var(--display);letter-spacing:.06em;color:var(--torch);text-align:center;pointer-events:none}
.islot .mk{position:absolute;top:4px;left:4px;width:6px;height:6px;background:var(--moss);pointer-events:none}
.islot .mk.spare{background:var(--ember)}
.islot .pk{position:absolute;top:3px;left:3px;min-width:16px;height:16px;padding:0 3px;display:grid;place-items:center;border-radius:2px;background:var(--torch);color:var(--torch-ink);font:600 11px/1 var(--body);font-variant-numeric:tabular-nums;pointer-events:none}
.islot .slt{width:14px;height:14px;color:var(--line)}
.tip{position:absolute;z-index:3;display:flex;flex-direction:column;gap:3px;padding:5px 8px;border:2px solid var(--tip-edge);border-radius:2px;background:var(--tip);font:500 14px/1.15 var(--display);color:var(--fg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%)}
.tip i{font-style:normal;font-size:13px}
.tip .t-hand,.tip .t-on{color:var(--torch)}
.tip .t-rec{color:var(--moss)}
.tip .t-spare{color:var(--ember)}
.tip .t-lv{color:var(--arcane)}
.tip .t-key{color:var(--muted)}

/* ---------- almanac: creatures with study stages ---------- */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.entry{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:center}
button.entry{cursor:pointer}
.entry img{width:32px;height:32px}
.entry span{font-size:12px;line-height:1.2;text-wrap:balance}
.entry.unk{justify-content:center;min-height:72px;background:transparent;border-style:dashed}
.entry.unk i{font:700 22px/1 var(--display);font-style:normal;color:var(--line)}
.rows{display:flex;flex-direction:column;gap:8px}
.rowcard{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.rowcard b{display:block;font:500 17px/1.15 var(--display)}
.rowcard.unk{cursor:default;background:transparent;border-style:dashed}
.rowcard.unk .face{background:transparent;border:1px dashed var(--line)}
.rowcard .wins{font:400 13px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.new-dot::after{content:"";position:absolute;top:8px;right:8px;width:6px;height:6px;background:var(--torch)}
.study{display:flex;align-items:center;gap:3px;margin-top:6px}
.study i{width:18px;height:6px;border-radius:1px;background:var(--seg)}
.study i.on{background:var(--torch)}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ladder div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-align:center}
.ladder i{height:6px;border-radius:1px;background:var(--seg)}
.ladder .on{color:var(--fg)}
.ladder .on i{background:var(--torch)}
.facts{margin:0;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.facts div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.facts div+div{border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 10px;font:500 14px/1.2 var(--body);text-align:right;font-variant-numeric:tabular-nums}
.facts dd span{display:inline-flex;align-items:center;gap:5px}
.facts dd img{width:20px;height:20px}
.intents{display:flex;flex-wrap:wrap;gap:6px}
.intent{padding:6px 9px;border-radius:3px;background:var(--seg);font:500 13px/1 var(--display)}
.intent.hit{color:var(--blood)}
.intent.calm{color:var(--muted)}
.intent.warn{color:var(--torch)}
.lockrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.lockrow .ico{width:14px;height:14px}
.lockrow b{font:500 15px/1.15 var(--display)}
.lockrow span{font:400 13px/1 var(--body);font-variant-numeric:tabular-nums}
.studied{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 12px;border:1px solid var(--star-dim);border-radius:6px;background:var(--panel)}
.studied b{font:500 16px/1 var(--display);color:var(--star)}
.mini{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.mini .cell{width:52px;height:52px}
.mini .cell img:not(.n){width:32px;height:32px}
.mini .op{margin:0}

/* ---------- tab bar, toast, sheet ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-block:6px 26px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-top:1px solid var(--line);background:var(--bg)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 4px;border:0;background:transparent;color:var(--muted);font:500 11px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;text-decoration:none;cursor:pointer}   /* five tabs, as in the bot: "Campaigns" has to fit */
.tab .ico{width:30px;height:30px}
.tab[aria-current="page"]{color:var(--torch)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:3px;margin-left:-11px;background:var(--torch)}
.tab .dot{position:absolute;top:4px;left:50%;width:6px;height:6px;margin-left:12px;background:var(--torch)}
.toast{position:absolute;left:16px;right:16px;top:10px;z-index:30;padding:11px 14px;border:1px solid var(--line);border-left-width:4px;border-radius:6px;background:var(--panel-hi);font:500 14px/1.25 var(--body);box-shadow:0 10px 30px var(--bezel);pointer-events:none;animation:toast .2s ease-out}
.toast.recipe{border-left-color:var(--torch)}
.toast.almanac{border-left-color:var(--arcane)}
.toast.unlock{border-left-color:var(--moss)}
@keyframes toast{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.backdrop{position:absolute;inset:0;z-index:20;background:var(--veil)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:82%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding-block:8px 30px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0}
.sheet.in{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{flex:none;width:40px;height:4px;margin:0 auto 2px;border-radius:2px;background:var(--line)}
.plinth{position:relative;flex:none;height:140px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:radial-gradient(55% 60% at 50% 50%, var(--glow-soft), transparent 72%), var(--well)}
.plinth::after{content:"";position:absolute;left:50%;bottom:18px;width:84px;height:10px;margin-left:-42px;border-radius:50%;background:var(--shadow)}
.plinth img{position:relative;z-index:1;width:96px;height:96px}
.plinth .q{position:relative;z-index:1;font:700 48px/1 var(--display);color:var(--line)}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sh-title b{font:500 21px/1.1 var(--display);color:var(--torch)}
.sh-title span{font-size:12px;color:var(--muted)}
.sheet .sec{margin-top:2px}
/* lists in sheets: weapons to hold, gear to wear */
.lrows{display:flex;flex-direction:column;gap:6px}
.lrow{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 12px 8px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.lrow.on{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch);cursor:default}
.lrow b{display:block;font:500 16px/1.15 var(--display)}
.lrow .meta{display:flex;gap:10px;align-items:baseline;margin-top:5px}
.lrow .msrc{align-items:center;gap:5px;font-size:12px;color:var(--muted)}   /* where a move comes from: the item, its level, the subclass */
.lrow .msrc img{width:16px;height:16px}
.lrow.off{border-style:dashed;background:transparent;cursor:default}   /* locked: another weapon, gear or level would give it */
.lrow.off b,.lrow.off .face img{opacity:.55}
/* floor stars: the three conditions */
.srows{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted)}
.srow .ico{width:18px;height:18px;color:var(--star-dim)}
.srow b{font:500 16px/1.15 var(--display)}
.srow.on{color:var(--fg)}
.srow.on .ico{color:var(--star)}

/* ---------- notes beside the phone ---------- */
.notes{display:none;flex:0 1 300px;max-width:300px;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin;flex-direction:column;gap:22px}
.brand{font:700 34px/1 var(--display);color:var(--torch)}
.lede{margin:8px 0 0;font-size:15px;color:var(--muted)}
.note h3{margin:0 0 8px;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.note p{margin:0;font-size:14px}
.note a{color:var(--torch);text-underline-offset:3px}
.note .cur{color:var(--fg)}
.dev{padding:2px 7px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--torch);font-size:13px;cursor:pointer}
.dev[aria-pressed="true"]{border-color:var(--torch)}
.foot{margin:0;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (min-width:1000px){.notes{display:flex}}

/* ---------- on a real phone: no frame ---------- */
@media (max-width:599px){
  body{background:var(--bg)}
  .stage{display:block;height:100%;min-height:0;padding:0;background:var(--bg)}
  .device{width:100%;height:100%;aspect-ratio:auto;padding:0;border-radius:0;background:var(--bg);box-shadow:none}

  .statusbar,.homebar{display:none}
  .topbar{padding-top:10px}

  .sheet{padding-bottom:16px}
}
@media (prefers-reduced-motion:reduce){.view.fwd,.view.rev,.sheet.in,.toast,.btn.pulse,.islot.fit::before,.shake,.lv.up,.tnode.can{animation:none}}

function readSave() {   // anything the writer left out gets the empty shape; unknown fields are kept and written back
  const s = readJSON("gamey.save", null);
  if (!s || s.v !== 1 || typeof s.floor !== "number" || s.floor < 1 || !Array.isArray(s.bag)) return null;
  const arr = a => Array.isArray(a) ? a : [];
  const belt = arr(s.belt).slice(0, BELT); while (belt.length < BELT) belt.push(null);
  return { ...s, bag: s.bag.filter(x => x && typeof x.key === "string" && x.n > 0), hand: s.hand || null, moves: arr(s.moves),
    creatures: obj(s.creatures), recipes: arr(s.recipes), camp: arr(s.camp), makeable: s.makeable | 0, time: obj(s.time),
    wallet: obj(s.wallet), levels: obj(s.levels), gear: obj(s.gear), belt, stars: obj(s.stars) };
}

function normParty(s) {   // a loadout per hero; the top-level hand / gear / belt are the lead's (03 writes only those), in an older save Ari's
  const hs = obj(s.heroes), out = {}, got = obj(obj(s.shop).heroes);
  const ids = ["ari", ...Object.keys(got).filter(h => h !== "ari" && HEROES[h] && got[h] > 0)];
  const lead = ids.includes(s.active) ? s.active : "ari", top = ["hand", "gear", "belt", "moves"].some(k => k in s);
  ids.forEach(h => {
    const x = obj(hs[h]), src = h === lead && top ? s : x;
    const belt = (Array.isArray(src.belt) ? src.belt : []).slice(0, BELT); while (belt.length < BELT) belt.push(null);
    const cls = (Array.isArray(x.cls) ? x.cls : []).filter(c => Array.isArray(c) && CLASSES[c[0]]);
    out[h] = { ...x, cls, tree: obj(x.tree), lv: cls.length ? cls.reduce((n, c) => n + (c[1] | 0), 0) : Math.max(1, x.lv | 0),   // the hero's level is the sum of class levels
      hand: src.hand || null, gear: { ...obj(src.gear) }, moves: (Array.isArray(src.moves) ? src.moves : []).slice(0, MOVE_SLOTS), belt };
  });
  s.heroes = out;
  if (!out[s.active]) s.active = "ari";
  return s;
}

function track(e, props) {
  props = props || {};
  console.debug("[track]", e, props);
  try {
    const l = readJSON("gamey.events", []), log = Array.isArray(l) ? l : [];

}

function mk(rows, pal) {
  const c = document.createElement("canvas"); c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext("2d");
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}

function openItem(k) {
  const it = item(k), r = RECIPES.find(x => x.out === k && known(x));
  track("almanac_view", { tab: isWeapon(k) ? "weapons" : "items", entry: k });
  let body = "";
  if (isWeapon(k) && have(k)) body += `<div class="tierbox"><div class="wrow">${starsOf(k)}${lvHTML(k)}</div>${xbar(k)}</div>`;
  if (r) body += `<h3 class="sec">${t("alm.recipe")}</h3><div class="mini">${r.in.map(([x, n]) =>
    `<span class="cell">${img(item(x).spr)}${n > 1 ? countImg(n) : ""}</span>`).join('<span class="op">+</span>')}<span class="op">=</span><span class="cell">${img(it.spr)}</span></div>`;
  else {
    const c = it.from && CREATURES[it.from], at = it.at || (c ? t("alm.from", { name: c.name, n: c.floor }) : "");
    if (at) body += `<dl class="facts"><div><dt>${t("alm.foundAt")}</dt><dd>${at}</dd></div></dl>`;
  }
  openSheet(img(it.spr), it.name, t("type." + it.type), body);
}

/* ================= navigation ================= */
let tab = "camp", sub = null, subFrom = null;   // subFrom: a table opened from a build goes back to it
const views = [...document.querySelectorAll(".view")], viewsEl = $("views");
function syncBack() {   // Telegram's own back button: sheet → sub-screen → almanac → home
  if (!window.GY) return;
  if (!$("sheet").hidden) window.GY.back(closeSheet);
  else if (sub) window.GY.back(back);
  else if (tab !== "camp") window.GY.back(() => { tab = "camp"; show("rev"); });
  else window.GY.back(null);   // Camp is a tab like the lobby's: no back at its root
}
function show(dir) {
  const id = sub || tab, cur = views.find(v => v.dataset.view === id);
  views.forEach(v => { v.hidden = v !== cur; });
  if (dir && !still) { cur.classList.remove("fwd", "rev"); void cur.offsetWidth; cur.classList.add(dir); }
  $("tbRoot").hidden = !!sub; $("tbSub").hidden = !sub;
  if (sub) {
    $("tbTitle").textContent = t(sub === "table" ? "table.title" : sub === "tree" ? "tree.title" : "build.title");
    $("tbSubt").textContent = sub === "tree" ? t("hero." + bh) : t(save.floor >= SHELTER ? "camp.shelter" : "camp.landing");
  }
  document.querySelectorAll(".tab[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  tip = { key: null };
  renderTop();
  if (id === "camp") renderCamp();
  if (id === "build") renderBuild();
  if (id === "tree") renderTree();
  if (id === "table") renderTable();
  if (id === "almanac") renderAlmanac();
  viewsEl.scrollTop = 0;
  syncBack();
}
function back() { sub = subFrom; subFrom = null; show("rev"); }   // the table or the tree opened from a build go back to it
function go(where, o) {
  o = o || {};
  if (where === "build") { bh = o.hero; sub = "build"; subFrom = null; show("fwd"); return; }
  if (where === "tree") { subFrom = "build"; sub = "tree"; tcls = null; show("fwd"); return; }
  if (where === "table") {
    subFrom = sub === "build" ? "build" : null; sub = "table"; ttab = o.ttab || "recipes"; shown = o.rec || null;
    feed = { target: o.target || feed.target, picked: {}, flash: false };
    track("recipe_view", { tab: ttab, entry: o.rec || null });
    show("fwd");
    if (o.rec) { const h = $("fusehead"); if (h) h.scrollIntoView({ block: "start" }); }   // Ascend: the recipe's pieces glow in the bag
  } else {
    sub = null; tab = "almanac"; aseg = "creatures";
    track("almanac_view", { tab: "creatures", entry: null });
    seenCreatures(); show("fwd");
  }
}

/* ================= input ================= */
document.addEventListener("click", e => {
  if (performance.now() - dragEndAt < 150) { dragEndAt = 0; return; }   // swallow one stray click, never a real tap after it
  const el = e.target.closest("button, [data-rec]");
  const prevTip = tip.key;
  if ((!el || !el.dataset.bag) && tip.key) {   // a tap anywhere else lets the tooltip go
    tip = { key: null };
    if ($("bag")) $("bag").querySelectorAll('[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false"));
    placeTip();
  }
  if (!el) return;
  const d = el.dataset;
  if (d.go) go(d.go);
  else if (d.tab) {
    if (d.tab === tab && !sub) { viewsEl.scrollTo({ top: 0, behavior: still ? "auto" : "smooth" }); return; }
    tab = d.tab; sub = null; subFrom = null;
    if (tab === "almanac") { track("almanac_view", { tab: aseg, entry: null }); if (aseg === "creatures") seenCreatures(); }
    show("fwd");
  }
  else if (d.foe) openCreature(d.foe);
  else if (d.rec) showRec(d.rec);
  else if (d.bag) {
    place(d.bag);
    tip = prevTip === d.bag && !(bench.a === d.bag || bench.b === d.bag) ? { key: null } : { key: d.bag };
    renderTable();
  }
  else if (d.cell) { bench[d.cell] = null; bench.note = ""; bench.out = null; haptic("tick"); renderTable(); }
  else if (el.id === "fuse") fuse();
  else if (d.ttab) { ttab = d.ttab; feed.picked = {}; track("recipe_view", { tab: ttab, entry: null }); renderTable(); }
  else if (d.item) openItem(d.item);
  else if (d.seg) {
    aseg = d.seg; track("almanac_view", { tab: aseg, entry: null });
    if (aseg === "creatures") seenCreatures();
    renderAlmanac();
  }
  else if (d.hero) go("build", { hero: d.hero });
  else if (d.lead) lead(d.lead);
  else if (d.sheet === "hand") openHand();
  else if (d.race) openRace(d.race);
  else if (d.cls) go("tree");
  else if (d.tcls) { tcls = d.tcls; haptic("tick"); renderTree(); }
  else if (d.node) openNode(d.node);
  else if (d.learn) learn(d.learn);
  else if (d.move) openMove(+d.move);
  else if (d.pick) pickMove(d.pick, +d.i);
  else if (d.hold) hold(d.hold);
  else if (d.slot) openSlot(d.slot);
  else if (d.wear) wear(d.wear, d.s);
  else if (d.off) takeOff(d.off);
  else if (d.stars) openStars(+d.stars);
  else if (d.feedw) { if (!$("sheet").hidden) closeSheet(); go("table", { ttab: "feed", target: d.feedw }); }
  else if (d.asc) { if (!$("sheet").hidden) closeSheet(); if (sub === "table") { ttab = "recipes"; showRec(d.asc); } else go("table", { rec: d.asc }); }
  else if (d.ft) { feed = { target: d.ft, picked: {}, flash: false }; haptic("tick"); renderTable(); }
  else if (d.food) pick(d.food, el);
  else if (el.id === "eat") eat();
  else if (el.id === "gems") location.href = SHOP + "?gems";   // the crystal packs, as from 01
  else if (el.hasAttribute("data-close")) closeSheet();
  else if (el.id === "back") back();
  else if (d.dev) dev(d.dev);
});
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.rec) { e.preventDefault(); showRec(e.target.dataset.rec); return; }
  if (e.key !== "Escape") return;
  if (!$("sheet").hidden) closeSheet();
  else if (sub) back();
});

/* ================= design-notes helpers (the Telegram build drops the notes) ================= */
function noteSource() {
  const n = $("srcNote"); if (!n) return;
  n.innerHTML = !demo ? "Сейчас: <code>gamey.save</code>; крафт, корм, снаряжение и выбор героя пишут его обратно."
    : wantSave ? "Сохранения нет — показано демо ветерана, в памяти." : "Сейчас: демо ветерана в памяти, <code>gamey.save</code> не трогает.";
  const v = $("devVet"), s = $("devSave");
  if (v) v.setAttribute("aria-pressed", String(!wantSave));
  if (s) s.setAttribute("aria-pressed", String(wantSave));
}
function dev(k) {
  if (k === "vet") { location.href = location.pathname; return; }
  if (k === "save") { location.href = location.pathname + "?save"; return; }
  if (k === "tails") for (let i = 0; i < 3; i++) give("tail");
  save.makeable = canMake().length; persist();
  bench = { a: null, b: null, out: null, note: "", tone: "" }; shown = null;
  show();
}

/* ================= init ================= */
$("coinImg").src = sprURL("coin"); $("gemImg").src = sprURL("gem");
save.makeable = canMake().length;
noteSource();
const from = /03-run|run\.html/.test(document.referrer) ? "run" : /01-|index\.html/.test(document.referrer) ? "home" : "direct";
document.querySelectorAll("[data-home]").forEach(a => { a.href = HOME + "?tab=" + a.dataset.home; });   // the lobby's own tabs; a link with a parameter is built from the name (CONTRACT)
track("camp_open", { tab: "camp", entry: from });
show();
})();
</script>
