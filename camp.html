<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tg.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0a0c}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* the Telegram build is always the phone layout: no device frame, no design notes */
.stage{display:block!important;height:100%!important;min-height:0!important;padding:0!important}
.device{width:100%!important;height:100%!important;aspect-ratio:auto!important;padding:0!important;border-radius:0!important;box-shadow:none!important}
.app{border-radius:0!important}
.statusbar,.homebar,.notes{display:none!important}
/* in full screen, stay clear of the phone's status bar and Telegram's own buttons */
:root{--tg-top:calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));--tg-bottom:var(--tg-safe-area-inset-bottom, 0px)}
.top{padding-top:calc(var(--tg-top) + 10px)!important}
.bottom{padding-bottom:calc(var(--tg-bottom) + 10px)!important}
.topbar{padding-top:calc(var(--tg-top) + 8px)!important}
.tabbar{padding-bottom:calc(var(--tg-bottom) + 8px)!important}
.sheet{padding-bottom:calc(var(--tg-bottom) + 16px)!important}
</style>
</head>
<body>
<title>Game Y Camp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = phone frame with design notes beside it; phone = the app itself, edge to edge.
   Camp = top bar / scrolling view / tab bar Play · Camp · Almanac · Shop, as in state 1. The alchemy table is a sub-screen,
   creature and item cards open as bottom sheets. Same single dark world and palette as the other states; sprites 16×16. */
:root{
  --stage:#0c0a0d;
  --bg:#141216;
  --panel:#201c22;
  --panel-hi:#29232b;
  --seg:#2c262d;
  --well:#0e0c10;
  --line:#3a3238;
  --fg:#ece3d2;
  --muted:#9d929a;
  --torch:#e2b24c;
  --torch-dim:#5b4524;
  --torch-ink:#1a1209;
  --blood:#cf4656;
  --moss:#7fa48a;
  --moss-dim:#26332b;
  --arcane:#8f7ad1;
  --ember:#d98a3d;
  --star:#f3d36b;
  --star-dim:#6a5a2a;
  --scrim:rgba(20,18,22,.95);
  --scrim-mid:rgba(20,18,22,.7);
  --veil:rgba(8,6,9,.6);
  --glow:rgba(226,178,76,.07);
  --glow-soft:rgba(226,178,76,.14);
  --glow-strong:rgba(226,178,76,.28);
  --pulse:rgba(226,178,76,.55);
  --pulse-0:rgba(226,178,76,0);
  --shadow:rgba(0,0,0,.5);
  --ink:#000;
  --stone:#2a2529;
  --slot:#161317;
  --wood:#4a3020;
  --wood-hi:#6e4426;
  --wood-lo:#2a1a10;
  --bevel-hi:rgba(255,255,255,.12);
  --bevel-lo:rgba(0,0,0,.6);
  --hover:rgba(255,255,255,.22);
  --tip:rgba(16,0,16,.94);
  --tip-edge:#4b1fa8;
  --bezel:#050406;
  --bezel-edge:#2c262e;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{font-variant-ligatures:none!important}   /* Pixelify Sans turns "fl" into a broken glyph; !important because every font shorthand resets it */
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.num{font-family:var(--body);font-variant-numeric:tabular-nums}   /* digits in Golos: Pixelify's small 2 and 5 read as 8 and S */

/* ---------- stage & device (same as the other states) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:radial-gradient(60% 55% at 50% 45%, var(--glow), transparent 70%)}
.device{position:relative;flex:none;height:clamp(640px, calc(100vh - 48px), 864px);height:clamp(640px, calc(100dvh - 48px), 864px);aspect-ratio:410/864;padding:10px;border-radius:58px;background:var(--bezel);box-shadow:0 0 0 1px var(--bezel-edge), 0 40px 90px -30px var(--bezel)}
.app{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{flex:none;position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 36px;font:600 15px/1 var(--body);color:var(--fg)}
.island{position:absolute;top:11px;left:50%;width:118px;height:33px;margin-left:-59px;border-radius:17px;background:var(--bezel)}
.sys{display:flex;gap:6px;align-items:center}
.sys svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;z-index:30;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.75;pointer-events:none}

/* ---------- top bar ---------- */
.topbar{flex:none;padding-block:6px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--bg)}
.tb-root{display:flex;align-items:center;gap:12px;min-height:42px}
.hero{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.avatar{flex:none;width:42px;height:42px;display:grid;place-items:center;overflow:hidden;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;image-rendering:auto}   /* painted face from art/ari-torch.jpg, as in 01 */
.who{min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font:500 17px/1.1 var(--display)}
.who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:500 14px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--star)}
.chip .ico{width:14px;height:14px}
.tb-sub{display:flex;align-items:center;gap:12px;min-height:42px}
.back{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.back .ico{width:16px;height:14px}
.tb-title{min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-title b{font:500 18px/1.1 var(--display)}
.tb-title span{font-size:12px;color:var(--muted)}

/* ---------- views ---------- */
.main{position:relative;flex:1;min-height:0;display:flex}
.views{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:12px;padding-block:16px 24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.view.fwd{animation:fwd .22s ease-out}
.view.rev{animation:rev .22s ease-out}
@keyframes fwd{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes rev{from{opacity:.3;transform:translateX(-14px)}to{opacity:1;transform:none}}
.vh{display:flex;flex-direction:column;gap:4px;padding-bottom:2px}
.vh h2{margin:0;font:700 26px/1.05 var(--display)}
.sec{margin:8px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec span{font:400 12px/1 var(--body);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.ico{display:block;flex:none;background:currentColor;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.narr{margin:-4px 0 0;font-size:14px;font-style:italic;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border:0;border-radius:4px;background:var(--torch);color:var(--torch-ink);font:500 17px/1 var(--display);cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:15px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.pulse{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pulse)}100%{box-shadow:0 0 0 14px var(--pulse-0)}}
.btn:active,.tile:active,.newcard button:active,.go:active,.rowcard:active,button.entry:active,button.cell:active,.where:active,.back:active{transform:translateY(1px)}

/* ---------- camp: scene strip (pixel art, 3 screen px per art px) ---------- */
.strip{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;width:100%;min-height:148px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background-color:var(--panel);background-repeat:no-repeat;background-position:right bottom;image-rendering:pixelated;overflow:hidden}
.strip::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, var(--scrim) 0%, var(--scrim) 22%, var(--scrim-mid) 40%, transparent 62%)}
.strip>*{position:relative}
.strip .eyebrow{font:500 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.strip .title{font:700 25px/1.05 var(--display);margin-top:2px}
.strip .meta{font-size:13px;color:var(--muted)}

/* one card: what opened on this return */
.newcard{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--torch-dim);border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--torch-dim)}
.newcard .eyebrow{font:500 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--torch)}
.newrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.newcard button,.newcard .nitem{min-width:0;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--seg);font:500 15px/1.15 var(--display);text-align:left;cursor:pointer}
.newcard .nitem{cursor:default}
.newcard .ico{width:22px;height:22px;color:var(--torch)}

/* tiles: table and almanac */
.tile{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.tface{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;background:var(--seg);color:var(--fg)}
.tface .ico{width:26px;height:26px}
.tbody{min-width:0;display:flex;flex-direction:column;gap:3px}
.tbody b{font:500 18px/1.1 var(--display)}
.tbody span{font-size:13px;color:var(--muted)}
.badge{min-width:24px;height:24px;padding:0 7px;display:grid;place-items:center;border-radius:12px;background:var(--blood);color:var(--fg);font:600 13px/1 var(--body);font-variant-numeric:tabular-nums}
.chev{width:10px;height:14px;color:var(--muted)}
.pill{flex:none;padding:5px 7px;border-radius:3px;font:500 12px/1 var(--display);letter-spacing:.06em;white-space:nowrap}
.pill.new{background:var(--torch-dim);color:var(--torch)}
.pill.ok{background:var(--moss-dim);color:var(--moss)}
.pill.off{background:var(--seg);color:var(--muted)}

/* shelf: special items stand on a plank */
.shelf{position:relative;display:flex;gap:8px;padding:8px 12px 0;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg, var(--panel) 0%, var(--panel) calc(100% - 12px), var(--wood-hi) calc(100% - 12px), var(--wood-hi) calc(100% - 10px), var(--wood) calc(100% - 10px), var(--wood-lo) 100%)}
.shelf .islot{width:50px;margin-bottom:12px}
.shelf .islot.empty{background:transparent;box-shadow:none;border:1px dashed var(--line)}
.shelf .islot.shake{animation:shake .32s linear}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}

/* sticky: the next floor */
.go{position:sticky;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;margin-top:4px;padding:12px 16px;border:0;border-radius:6px;background:var(--torch);color:var(--torch-ink);cursor:pointer;box-shadow:0 -14px 22px var(--bg)}
.go b{font:500 21px/1.05 var(--display)}
.go span{font-size:12px;font-weight:500;opacity:.8}
.go b .num{font-size:1.1em;font-weight:600}

/* ---------- table ---------- */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;border:0;border-radius:4px;background:transparent;color:var(--muted);font:500 14px/1 var(--display);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel-hi);color:var(--torch)}
.seg button.locked{opacity:.6}
.seg .ico{width:10px;height:10px}
.seg .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;background:var(--torch)}

.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rec.can{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch), 0 0 18px var(--glow-soft)}
.rec[data-rec]{cursor:pointer}
.rec.on{border-color:var(--torch);background:var(--panel-hi)}   /* the recipe being shown in the bag */
.rec.sil{background:transparent;border-style:dashed}
.rec.sil b{color:var(--muted);letter-spacing:.1em}
.face{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:4px;background:var(--seg);font:700 20px/1 var(--display);color:var(--line)}
.face img{width:32px;height:32px}
.rec.sil .face{background:transparent;border:1px dashed var(--line)}
.rbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.rbody b{display:flex;align-items:center;gap:8px;font:500 16px/1.15 var(--display)}
.rbody p{margin:0;font-size:13px;color:var(--muted)}
.tagnew{padding:3px 5px;border-radius:3px;background:var(--torch-dim);color:var(--torch);font:500 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.ings{display:flex;flex-wrap:wrap;gap:4px 10px}
.ing{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.ing img{width:16px;height:16px}
.ing i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--blood)}
.ing.ok i{color:var(--moss)}
.where{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--torch);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.where .chev{width:6px;height:9px;color:var(--torch)}
.known{display:flex;flex-direction:column;gap:6px}
.krow{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.krow img{width:20px;height:20px}
.krow .op{color:var(--muted)}
.krow b{margin-left:4px;font:500 14px/1.1 var(--display)}

/* free fusion: two cells and the result, as at the run's table */
.bench{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:4px;align-items:start;padding:14px 8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.part{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.cell{position:relative;width:60px;height:60px;max-width:100%;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:4px;background:var(--well);font:700 22px/1 var(--display);color:var(--line)}
button.cell{cursor:pointer}
.cell img:not(.n){width:40px;height:40px}
.cell .n{position:absolute;right:3px;bottom:3px}
.cell.empty{border-style:dashed;background:transparent}
.cell.dim img{opacity:.4}
.part.res .cell{border-color:var(--torch);box-shadow:inset 0 0 0 1px var(--torch)}
.part.res.done .cell{box-shadow:inset 0 0 0 1px var(--torch), 0 0 22px var(--glow-strong)}
.part b{min-height:15px;font:500 13px/1.15 var(--display)}
.op{margin-top:20px;font:700 20px/1 var(--display);color:var(--muted)}
.tablerow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px}
.tablenote{font:500 15px/1.2 var(--display)}
.tablenote.bad{color:var(--blood)}
.tablenote.good{color:var(--torch)}
/* dragging from the bag onto the table, as in the run */
.dragicon{position:absolute;z-index:23;width:48px;height:48px;margin:-24px 0 0 -24px;pointer-events:none;filter:drop-shadow(0 6px 6px var(--ink))}
.bench.drop .cell[data-spot]{border-style:dashed;border-color:var(--torch)}
.cell.over{background:var(--panel-hi);box-shadow:0 0 0 2px var(--torch)}

/* bag: a Minecraft-style inventory, as in Builds: bevelled slots on a stone panel, stack counts in pixel digits, a purple tooltip */
.inv{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;border:1px solid var(--ink);background:var(--stone);box-shadow:inset 2px 2px 0 var(--bevel-hi), inset -2px -2px 0 var(--bevel-lo)}
.islot{position:relative;min-width:0;aspect-ratio:1/1;display:grid;place-items:center;padding:0;border:0;background:var(--slot);box-shadow:inset 2px 2px 0 var(--bevel-lo), inset -2px -2px 0 var(--bevel-hi)}
button.islot{cursor:pointer;touch-action:none}   /* a drag from the bag must not scroll the view */
.islot img{pointer-events:none}   /* no native image drag on desktop */
.islot.fit{z-index:1}
.islot.fit::before{content:"";position:absolute;inset:0;border:2px solid var(--torch);background:var(--glow-strong);animation:pulse 1.6s ease-out infinite;pointer-events:none}   /* the shown recipe's ingredients, as the run's fitting items */
.islot img:not(.n){width:32px;max-width:66%;height:auto}
.islot .n{position:absolute;right:3px;bottom:3px}
.islot[aria-pressed="true"]::after{content:"";position:absolute;inset:2px;background:var(--hover)}
.islot.used img:not(.n){opacity:.25}
.islot.hand{box-shadow:inset 0 0 0 2px var(--torch), inset 2px 2px 0 2px var(--bevel-lo)}
.islot .hl{position:absolute;top:4px;left:0;right:0;font:500 9px/1 var(--display);letter-spacing:.06em;color:var(--torch);text-align:center;pointer-events:none}
.islot .mk{position:absolute;top:4px;left:4px;width:6px;height:6px;background:var(--moss);pointer-events:none}
.islot .mk.spare{background:var(--ember)}
.tip{position:absolute;z-index:3;display:flex;flex-direction:column;gap:3px;padding:5px 8px;border:2px solid var(--tip-edge);border-radius:2px;background:var(--tip);font:500 14px/1.15 var(--display);color:var(--fg);white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%)}
.tip i{font-style:normal;font-size:13px}
.tip .t-hand{color:var(--torch)}
.tip .t-rec{color:var(--moss)}
.tip .t-spare{color:var(--ember)}
.tip .t-key{color:var(--muted)}

.locknote{display:flex;gap:12px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.locknote .ico{width:16px;height:16px}
.locknote b{font:500 16px/1.15 var(--display)}

/* ---------- almanac: creatures with study stages ---------- */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.entry{position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:center}
button.entry{cursor:pointer}
.entry img{width:32px;height:32px}
.entry span{font-size:12px;line-height:1.2;text-wrap:balance}
.entry.unk{justify-content:center;min-height:72px;background:transparent;border-style:dashed}
.entry.unk i{font:700 22px/1 var(--display);font-style:normal;color:var(--line)}
.rows{display:flex;flex-direction:column;gap:8px}
.rowcard{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.rowcard b{display:block;font:500 17px/1.15 var(--display)}
.rowcard.unk{cursor:default;background:transparent;border-style:dashed}
.rowcard.unk .face{background:transparent;border:1px dashed var(--line)}
.rowcard .wins{font:400 13px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}

.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ladder div{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);text-align:center}

.facts div+div{border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 10px;font:500 14px/1.2 var(--body);text-align:right;font-variant-numeric:tabular-nums}
.facts dd span{display:inline-flex;align-items:center;gap:5px}
.facts dd img{width:20px;height:20px}
.intents{display:flex;flex-wrap:wrap;gap:6px}
.intent{padding:6px 9px;border-radius:3px;background:var(--seg);font:500 13px/1 var(--display)}
.intent.hit{color:var(--blood)}
.intent.calm{color:var(--muted)}

.lockrow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}

.studied b{font:500 16px/1 var(--display);color:var(--star)}
.studied span{font-size:13px;color:var(--muted)}

const SIL = "#463d46", SIL_MET = "#6c6170";   // unknown recipe / creature met once
const sils = {};
function silURL(k, col) {   // the sprite's shape in one flat colour
  const id = k + col;
  if (!sils[id]) {
    const s = SPR[k], c = document.createElement("canvas"); c.width = s.width; c.height = s.height;
    const g = c.getContext("2d"); g.drawImage(s, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
    sils[id] = c.toDataURL();
  }
  return sils[id];
}
const sil = (k, col) => SPR[k] ? `<img src="${silURL(k, col)}" alt="">` : "?";

// stack counts in a 3×5 pixel font with a drop shadow, as in Builds (Pixelify's small 2 and 5 read as 8 and S)
const DIGITS = ["#####.##.##.###", ".#.##..#..#.###", "###..#####..###", "###..#.##..####", "#.##.####..#..#",
                "####..###..####", "####..####.####", "###..#..#.#..#.", "####.#####.####", "####.####..####"];
const counts = {};
function countImg(q) {
  if (!counts[q]) {
    const s = String(q), c = document.createElement("canvas"); c.width = s.length * 4; c.height = 6;
    const g = c.getContext("2d");
    [["#000", 1], ["#ece3d2", 0]].forEach(([col, o]) => {   // shadow first, then the digit
      g.fillStyle = col;
      [...s].forEach((d, k) => [...DIGITS[d]].forEach((p, j) => { if (p === "#") g.fillRect(k * 4 + j % 3 + o, (j / 3 | 0) + o, 1, 1); }));
    });
    counts[q] = { src: c.toDataURL(), w: c.width * 2, h: c.height * 2 };
  }
  const n = counts[q];
  return `<img class="n" src="${n.src}" width="${n.w}" height="${n.h}" alt="">`;
}

const DPR = Math.max(1, Math.ceil(window.devicePixelRatio || 1)), masks = {};
function maskURL(k, cell) {
  const id = k + cell;
  if (!masks[id]) {
    const rows = MASK[k], s = cell * DPR;
    const c = document.createElement("canvas"); c.width = rows[0].length * s; c.height = rows.length * s;
    const g = c.getContext("2d"); g.fillStyle = "#fff";
    rows.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === "#") g.fillRect(x * s, y * s, s, s); }));
    masks[id] = c.toDataURL();
  }
  return masks[id];
}

function narrate(key, text, host) {   // italic, muted, under the scene; once per player
  if (once.has("narrate." + key)) return false;
  once.add("narrate." + key);
  const p = document.createElement("p"); p.className = "narr"; p.textContent = text; host.after(p);
  return true;
}
let toastT = 0, toastNext = null;
function toast(type, text) {   // almanac | recipe | unlock: at the top for 2 s; one waits at most, a newer one takes its place
  if (toastT) { toastNext = [type, text]; return; }
  const el = $("toast");
  el.className = "toast " + type; el.textContent = text; el.hidden = false;
  toastT = setTimeout(() => { el.hidden = true; toastT = 0; const n = toastNext; toastNext = null; if (n) toast(...n); }, 2000);
}
const haptic = k => { if (window.GY && window.GY.haptic) window.GY.haptic(k); };

  if (d.over && e.type === "pointerup") placeAt(d.over.dataset.spot, d.k);
  renderTable();
  dragEndAt = performance.now();   // the click a drag may end with comes right after it and is not a tap
}
document.addEventListener("pointerup", dragEnd);
document.addEventListener("pointercancel", dragEnd);
function take(k, n) { save.bag.forEach(x => { if (x.key === k && n > 0) { const d = Math.min(n, x.n); x.n -= d; n -= d; } }); save.bag = save.bag.filter(x => x.n > 0); }
function give(k) { const x = save.bag.find(y => y.key === k); if (x) x.n++; else save.bag.push({ key: k, n: 1 }); }
function fuse() {
  const { a, b } = bench; if (!a || !b) return;
  const r = match(a, b);
  if (!r) { bench.note = t("fuse.wont"); bench.tone = "bad"; haptic("error"); renderTable(); return; }
  const miss = short(r)[0];
  if (miss) { bench.note = t("fuse.short", { name: item(miss[0]).name, n: N(miss[1]) }); bench.tone = "bad"; haptic("error"); renderTable(); return; }
  const discovered = !known(r), hand = save.hand;
  r.in.forEach(([k, n]) => take(k, n));
  give(r.out);
  if (hand && !have(hand)) save.hand = item(r.out).type === "weapon" ? r.out : null;   // the weapon in hand went into it
  if (discovered) save.recipes.push(r.out);
  save.makeable = canMake().length;
  save.camp = [...new Set([...save.camp, ...Object.keys(CAMP_UNLOCKS).filter(f => +f <= save.floor).flatMap(f => CAMP_UNLOCKS[f].map(u => u.key))])];
  writeJSON("gamey.save", save); demo = false; noteSource();
  track("fuse", { recipe: r.out, auto: false, discovered });   // the table never lays items out itself
  bench = { a: null, b: null, out: r.out, note: discovered ? t("fuse.discovered") : "", tone: "good" };
  tip = { where: null, key: null }; shown = null;
  haptic("ok");
  if (discovered) toast("recipe", t("toast.recipe", { name: item(r.out).name }));
  renderTable(); renderCamp();
}

/* ================= almanac: Weapons · Creatures · Items ================= */
let aseg = "creatures";
function stageBar(st) { return `<div class="study" aria-label="${t("aria.stage", { n: st })}">${[1, 2, 3, 4].map(i => `<i${i <= st ? ' class="on"' : ""}></i>`).join("")}</div>`; }
function renderAlmanac() {
  const met = metList();
  let body = "";
  if (aseg === "creatures") {
    body = `<h3 class="sec">${t("alm.basement")} <span>${t("alm.met", { n: met.length })}</span></h3><div class="rows">${Object.keys(CREATURES).map(c => {
      const st = stage(c), cr = CREATURES[c];
      if (!st) return `<div class="rowcard unk" role="img" aria-label="${t("alm.notMet")}"><span class="face">?</span><b></b><span></span></div>`;
      const s = save.creatures[c] || {}, nw = nextWins(st);
      return `<button class="rowcard${freshCards.has(c) ? " new-dot" : ""}" type="button" data-foe="${c}">
        ${face(st >= 2 ? img(cr.spr) : sil(cr.spr, SIL_MET))}
        <div><b>${cr.name}</b>${stageBar(st)}</div>
        ${nw ? `<span class="wins">${t("alm.progress", { a: s.wins | 0, b: nw })}</span>` : `<span class="pill ok">${t("alm.studied")}</span>`}
      </button>`;
    }).join("")}</div>`;
  } else {
    const list = found().filter(k => aseg === "weapons" ? item(k).type === "weapon" : item(k).type !== "weapon");
    const cards = list.map(k => `<button class="entry" type="button" data-item="${k}">${img(item(k).spr)}<span>${item(k).name}</span></button>`);
    while (cards.length < 8 || cards.length % 4) cards.push('<div class="entry unk" role="img" aria-label="?"><i aria-hidden="true">?</i></div>');
    body = `<h3 class="sec">${t("alm.basement")} <span>${t("alm.found", { n: list.length })}</span></h3><div class="cards">${cards.join("")}</div>`;
  }
  $("almanac").innerHTML = `<div class="vh"><h2>${t("alm.title")}</h2></div>
    <div class="seg" role="tablist" aria-label="${t("alm.title")}">${["weapons", "creatures", "items"].map(s =>
      `<button type="button" role="tab" data-seg="${s}" aria-selected="${aseg === s}">${t("alm." + s)}${s === "creatures" && freshNow().length ? '<i class="dot"></i>' : ""}</button>`).join("")}</div>
    ${body}`;
}
function seenCreatures() {   // opening the tab puts out the "+N new" on the camp tile
  metList().forEach(c => once.add("camp.almanac." + c));
}

/* ================= sheets: creature card, item card ================= */
let lastFocus = null;
function openSheet(pic, title, sub, body) {
  const sh = $("sheet"), open = !sh.hidden;
  if (!open) lastFocus = document.activeElement;
  sh.innerHTML = `<div class="grab"></div><div class="plinth">${pic}</div>
    <div class="sh-head"><div class="sh-title"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</div><button class="btn ghost sm" type="button" data-close>${t("close")}</button></div>
    ${body}`;
  sh.setAttribute("aria-label", title);
  sh.hidden = $("backdrop").hidden = false;
  sh.scrollTop = 0;
  if (!open && !still) { sh.classList.remove("in"); void sh.offsetWidth; sh.classList.add("in"); }
  sh.querySelector("[data-close]").focus({ preventScroll: true });
  syncBack();
}
function closeSheet() {
  $("sheet").hidden = $("backdrop").hidden = true;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
  syncBack();
}
const winsLabel = n => t(n === 1 ? "alm.win" : "alm.wins", { n });
const lockrow = (label, a, b) => `<div class="lockrow">${ico("lock", "", 1)}<b>${label}</b><span>${b ? `${t("alm.progress", { a, b })} ${t(b === 1 ? "alm.win" : "alm.wins", { n: "" }).trim()}` : ""}</span></div>`;
function openCreature(c) {
  const cr = CREATURES[c], st = stage(c), w = (save.creatures[c] || {}).wins | 0;
  track("almanac_view", { tab: "creatures", entry: c });
  if (freshCards.delete(c) && aseg === "creatures" && !$("almanac").hidden) renderAlmanac();
  const pic = st >= 2 ? img(cr.spr) : SPR[cr.spr] ? sil(cr.spr, st ? SIL_MET : SIL) : '<span class="q">?</span>';
  const ladder = `<div class="ladder">${[t("alm.met1"), winsLabel(STUDY.stats), winsLabel(STUDY.intents), winsLabel(STUDY.studied)].map((l, i) =>
    `<div${i < st ? ' class="on"' : ""}><i></i>${l}</div>`).join("")}</div>`;
  let body = ladder;
  if (!st) body += lockrow(t("alm.notMet"));
  if (st >= 2) {
    const dmg = cr.intents.map(i => i[1]).filter(Boolean), lo = Math.min(...dmg), hi = Math.max(...dmg);
    const into = RECIPES.filter(r => revealed(r) && r.in.some(([k]) => k === cr.loot) && (known(r) || book().almost.includes(r) || book().can.includes(r)));
    body += `<dl class="facts">
      <div><dt>${t("alm.hp")}</dt><dd>${cr.hp}</dd></div>
      <div><dt>${t("alm.dmg")}</dt><dd>${lo === hi ? lo : `${lo}–${hi}`}</dd></div>
      <div><dt>${t("alm.loot")}</dt><dd><span>${img(item(cr.loot).spr)}${item(cr.loot).name}</span></dd></div>
      ${into.length ? `<div><dt>${t("alm.into")}</dt><dd>${into.map(r => `<span>${img(item(r.out).spr)}${item(r.out).name}</span>`).join("")}</dd></div>` : ""}
    </dl>`;
  } else if (st) body += lockrow(`${t("alm.hp")} · ${t("alm.loot")}`, w, STUDY.stats);
  if (st >= 3) body += `<h3 class="sec">${t("alm.intents")}</h3><div class="intents">${cr.intents.map(([k, d]) => `<span class="intent ${TONE[k]}">${t("intent." + k, { d: N(d) })}</span>`).join("")}</div>`;
  else if (st) body += lockrow(t("alm.intents"), w, STUDY.intents);
  if (st >= 4) body += `<div class="studied"><b>${t("alm.studied")}</b><span>${t("alm.quick", { n: unlockFloor("quick") })}</span></div>`;
  else if (st) body += lockrow(t("alm.studied"), w, STUDY.studied);
  openSheet(pic, st ? cr.name : cr.name, t("alm.at", { n: cr.floor }), body);
}
function openItem(k) {
  const it = item(k), r = RECIPES.find(x => x.out === k && known(x));
  track("almanac_view", { tab: it.type === "weapon" ? "weapons" : "items", entry: k });
  let body = "";
  if (r) body = `<h3 class="sec">${t("alm.recipe")}</h3><div class="mini">${r.in.map(([x, n]) =>
    `<span class="cell">${img(item(x).spr)}${n > 1 ? countImg(n) : ""}</span>`).join('<span class="op">+</span>')}<span class="op">=</span><span class="cell">${img(it.spr)}</span></div>`;
  else if (it.at) body = `<dl class="facts"><div><dt>${t("alm.foundAt")}</dt><dd>${it.at}</dd></div></dl>`;
  if (it.type === "special") body += `<div class="lockrow">${ico("lock", "", 1)}<b>${t("bag.key")}</b><span></span></div>`;
  openSheet(img(it.spr), it.name, t("type." + it.type), body);
}

/* ================= navigation ================= */
let tab = "camp", sub = null;
const views = [...document.querySelectorAll(".view")], viewsEl = $("views");
function syncBack() {   // Telegram's own back button: sheet → sub-screen → almanac → home
  if (!window.GY) return;
  if (!$("sheet").hidden) window.GY.back(closeSheet);
  else if (sub) window.GY.back(() => { sub = null; show("rev"); });
  else if (tab !== "camp") window.GY.back(() => { tab = "camp"; show("rev"); });
  else window.GY.back(() => { location.href = HOME; });
}
function show(dir) {
  const id = sub || tab, cur = views.find(v => v.dataset.view === id);
  views.forEach(v => { v.hidden = v !== cur; });
  if (dir && !still) { cur.classList.remove("fwd", "rev"); void cur.offsetWidth; cur.classList.add(dir); }
  $("tbRoot").hidden = !!sub; $("tbSub").hidden = !sub;
  if (sub === "table") { $("tbTitle").textContent = t("table.title"); $("tbSubt").textContent = t(save.floor >= unlockFloor("shelter") ? "camp.shelter" : "camp.landing"); }
  document.querySelectorAll(".tab[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  tip = { where: null, key: null };
  if (id === "camp") renderCamp();
  if (id === "table") renderTable();
  if (id === "almanac") renderAlmanac();
  viewsEl.scrollTop = 0;
  syncBack();
}
function go(where) {
  if (showNew) once.add("camp.new." + save.floor);   // the "new" card has done its job
  if (where === "table") { sub = "table"; ttab = "recipes"; shown = null; track("recipe_view", { tab: "recipes", entry: null }); }
  else { sub = null; tab = "almanac"; aseg = "creatures"; track("almanac_view", { tab: "creatures", entry: null }); seenCreatures(); }
  show("fwd");
}

/* ================= input ================= */
document.addEventListener("click", e => {
  if (performance.now() - dragEndAt < 150) { dragEndAt = 0; return; }   // swallow one stray click, never a real tap after it
  const el = e.target.closest("button, [data-rec]");
  const prevTip = tip.key;
  if (!el || !(el.dataset.bag || el.dataset.shelf)) {   // a tap anywhere else lets the tooltip go
    if (tip.where) { const w = tip.where; tip = { where: null, key: null }; if (w === "bag" && !$("table").hidden && $("bag")) $("bag").querySelectorAll('[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false")); placeTip(w); if (w === "shelf" && $("shelf")) $("shelf").querySelectorAll('[aria-pressed="true"]').forEach(b => b.setAttribute("aria-pressed", "false")); }
  }
  if (!el) return;
  const d = el.dataset;
  if (d.go) go(d.go);
  else if (d.tab) {
    if (d.tab === tab && !sub) { viewsEl.scrollTo({ top: 0, behavior: still ? "auto" : "smooth" }); return; }
    tab = d.tab; sub = null;
    if (tab === "almanac") { if (showNew) once.add("camp.new." + save.floor); track("almanac_view", { tab: aseg, entry: null }); if (aseg === "creatures") seenCreatures(); }
    show("fwd");
  }
  else if (d.rec) showRec(d.rec);
  else if (d.bag) {
    place(d.bag);
    tip = prevTip === d.bag && !(bench.a === d.bag || bench.b === d.bag) ? { where: null, key: null } : { where: "bag", key: d.bag };
    renderTable();
  }
  else if (d.cell) { bench[d.cell] = null; bench.note = ""; bench.out = null; haptic("tick"); renderTable(); }
  else if (el.id === "fuse") fuse();
  else if (d.ttab) {
    if (d.ttab === "feed" && !isOpen("feed")) { toast("unlock", t("table.feedLock", { n: unlockFloor("feed") })); haptic("error"); return; }
    ttab = d.ttab; track("recipe_view", { tab: ttab, entry: null }); renderTable();
  }
  else if (d.foe) openCreature(d.foe);
  else if (d.item) openItem(d.item);
  else if (d.seg) {
    aseg = d.seg; track("almanac_view", { tab: aseg, entry: null });
    if (aseg === "creatures") seenCreatures();
    renderAlmanac();
  }
  else if (d.shelf) {
    tip = prevTip === d.shelf ? { where: null, key: null } : { where: "shelf", key: d.shelf };
    $("shelf").querySelectorAll("[data-shelf]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.shelf === tip.key)));
    if (item(d.shelf).type === "special" && tip.key) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); haptic("error"); }
    placeTip("shelf");
  }
  else if (el.id === "next") {
    const s = $("nextSub"); s.textContent = t("camp.nextStub", { n: save.floor + 1 });
    clearTimeout(s._t); s._t = setTimeout(() => { s.textContent = t("camp.nextSub"); }, 2000);
  }
  else if (el.hasAttribute("data-close")) closeSheet();
  else if (el.id === "back") { sub = null; show("rev"); }
  else if (d.dev) dev(d.dev);
});
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.rec) { e.preventDefault(); showRec(e.target.dataset.rec); return; }
  if (e.key !== "Escape") return;
  if (!$("sheet").hidden) closeSheet();
  else if (sub) { sub = null; show("rev"); }
});

/* ================= design-notes helpers (the Telegram build drops the notes) ================= */
function noteSource() {
  const n = $("srcNote"); if (!n) return;
  n.innerHTML = demo ? "Сейчас: встроенное демо «после этажа 1» (<code>gamey.save</code> нет)." : "Сейчас: <code>gamey.save</code> из забега или после крафта.";
}
function dev(k) {
  if (k === "demo") { save = clone(DEMO_SAVE); demo = true; }
  if (k === "tails") { const x = save.bag.find(y => y.key === "tail"); if (x) x.n += 3; else save.bag.push({ key: "tail", n: 3 }); }
  if (k === "fresh") { try { const a = readJSON("gamey.once", []); localStorage.setItem("gamey.once", JSON.stringify((Array.isArray(a) ? a : []).filter(x => !/^(camp\.|narrate\.camp)/.test(x)))); } catch (e) {} location.reload(); return; }
  bench = { a: null, b: null, out: null, note: "", tone: "" }; shown = null;
  noteSource(); show();
}

/* ================= init ================= */
$("heroSub").textContent = t("hero.class");
noteSource();
const from = /03-run|run\.html/.test(document.referrer) ? "run" : /01-first|index\.html/.test(document.referrer) ? "home" : "direct";
track("camp_open", { tab: "camp", entry: from });
show();
})();
</script>
