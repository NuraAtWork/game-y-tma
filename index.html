<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tg.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0a0c}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* the Telegram build is always the phone layout: no device frame, no design notes */
.stage{display:block!important;height:100%!important;min-height:0!important;padding:0!important}
.device{width:100%!important;height:100%!important;aspect-ratio:auto!important;padding:0!important;border-radius:0!important;box-shadow:none!important}
.app{border-radius:0!important}
.statusbar,.homebar,.notes{display:none!important}
/* in full screen, stay clear of the phone's status bar and Telegram's own buttons */
:root{--tg-top:calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));--tg-bottom:var(--tg-safe-area-inset-bottom, 0px)}
.top{padding-top:calc(var(--tg-top) + 10px)!important}
.bottom{padding-bottom:calc(var(--tg-bottom) + 10px)!important}
.topbar{padding-top:calc(var(--tg-top) + 8px)!important}
.tabbar{padding-bottom:calc(var(--tg-bottom) + 8px)!important}
.sheet{padding-bottom:calc(var(--tg-bottom) + 16px)!important}
</style>
</head>
<body>
<meta charset="utf-8">
<title>Game Y First Touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = phone frame on a dark stage with design notes beside it; phone = the app itself, edge to edge.
   App = top bar (hero + purse) / scrolling view / bottom tab bar. Single dark world, same palette as the run prototype. */
:root{
  --stage:#0c0a0d;
  --bg:#141216;
  --panel:#201c22;
  --panel-hi:#29232b;
  --seg:#2c262d;
  --line:#3a3238;
  --fg:#ece3d2;
  --muted:#9d929a;
  --torch:#e2b24c;
  --torch-dim:#5b4524;
  --torch-ink:#1a1209;
  --blood:#cf4656;
  --moss:#7fa48a;
  --moss-dim:#26332b;
  --star:#f3d36b;
  --star-dim:#6a5a2a;
  --scrim:rgba(20,18,22,.95);
  --scrim-mid:rgba(20,18,22,.7);
  --glow:rgba(226,178,76,.07);
  --scrim-lock:rgba(20,18,22,.5);
  --pulse:rgba(226,178,76,.55);
  --pulse-0:rgba(226,178,76,0);
  --bezel:#050406;
  --bezel-edge:#2c262e;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{font-variant-ligatures:none!important}   /* Pixelify Sans turns "fl" into a broken glyph; !important because every font shorthand resets it */
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}

/* ---------- stage & device ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:radial-gradient(60% 55% at 50% 45%, var(--glow), transparent 70%)}
.device{position:relative;flex:none;height:clamp(640px, calc(100vh - 48px), 864px);height:clamp(640px, calc(100dvh - 48px), 864px);aspect-ratio:410/864;padding:10px;border-radius:58px;background:var(--bezel);box-shadow:0 0 0 1px var(--bezel-edge), 0 40px 90px -30px var(--bezel)}
.app{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

.statusbar{flex:none;position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 36px;font:600 15px/1 var(--body);color:var(--fg)}
.island{position:absolute;top:11px;left:50%;width:118px;height:33px;margin-left:-59px;border-radius:17px;background:var(--bezel)}
.sys{display:flex;gap:6px;align-items:center}
.sys svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.75;pointer-events:none}

/* ---------- top bar ---------- */
.topbar{flex:none;padding-block:6px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--bg)}
.tb-root{display:flex;align-items:center;gap:12px;min-height:42px}
.hero{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.avatar{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.avatar img{width:32px;height:32px}
.who{min-width:0;display:flex;flex-direction:column;gap:2px}
.who b{font:500 17px/1.1 var(--display)}
.who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.purse{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px 0 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:600 14px/1 var(--body);font-variant-numeric:tabular-nums}
.chip img{width:16px;height:16px}
.chip.star{color:var(--star)}
.tb-sub{display:flex;align-items:center;gap:12px;min-height:42px}
.back{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.back .ico{width:16px;height:14px}
.tb-title{min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-title b{font:500 18px/1.1 var(--display)}
.tb-title span{font-size:12px;color:var(--muted)}

/* ---------- views ---------- */
.main{position:relative;flex:1;min-height:0;display:flex}
.views{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:12px;padding-block:16px 24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.view.fwd{animation:fwd .22s ease-out}
.view.rev{animation:rev .22s ease-out}
@keyframes fwd{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes rev{from{opacity:.3;transform:translateX(-14px)}to{opacity:1;transform:none}}

.vh{display:flex;flex-direction:column;gap:4px;padding-bottom:2px}
.vh h2{margin:0;font:700 26px/1.05 var(--display);text-wrap:balance}
.vh p{margin:0;font-size:14px;color:var(--muted);text-wrap:pretty}
.sec{margin:8px 0 0;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stub{display:inline-block;vertical-align:1px;margin-left:4px;padding:2px 6px;border:1px dashed var(--muted);border-radius:3px;font:500 10px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border:0;border-radius:4px;background:var(--torch);color:var(--torch-ink);font:500 17px/1 var(--display);cursor:pointer;text-decoration:none}
.btn:active,.strip:active,.price:active{transform:translateY(1px)}

.ico{display:block;flex:none;background:currentColor;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

/* ---------- game: strips ---------- */
.strip{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;width:100%;min-height:134px;padding:14px 44px 14px 16px;border:1px solid var(--line);border-radius:6px;background-color:var(--panel);background-repeat:no-repeat;background-position:right bottom;image-rendering:pixelated;overflow:hidden;text-align:left;cursor:pointer}
.strip::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, var(--scrim) 0%, var(--scrim) 28%, var(--scrim-mid) 52%, transparent 82%)}
.strip>*{position:relative}
.strip .eyebrow{font:500 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.strip .title{font:700 25px/1.05 var(--display);margin-top:2px}
.strip .meta{font-size:13px;color:var(--muted);max-width:26ch}
.strip.main{min-height:224px;border-color:var(--torch-dim)}
.strip.main .eyebrow{color:var(--torch)}
.strip.main .title{font-size:32px}
.prog{display:flex;align-items:center;gap:10px;margin-top:8px}
.floors{flex:none;display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:3px;width:180px}
.floors i{height:6px;border-radius:1px;background:var(--seg)}
.floors i.done{background:var(--moss)}
.floors i.now{background:var(--torch)}
.prog b{font:600 13px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.cta{display:inline-flex;align-items:center;min-height:40px;margin-top:12px;padding:0 18px;border-radius:4px;background:var(--torch);color:var(--torch-ink);font:500 17px/1 var(--display)}
.num{font-family:var(--body);font-weight:600}   /* digits that matter: Pixelify's 2 and 5 read as 8 and S */

/* ---------- first touch & locks ---------- */
.strip.first{min-height:300px}
.strip.first .meta{max-width:30ch;font-size:14px;color:var(--fg)}
.cta.pulse{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pulse)}100%{box-shadow:0 0 0 14px var(--pulse-0)}}
.strip.locked{min-height:108px}
.strip.locked::before{background:linear-gradient(90deg, var(--scrim) 0%, var(--scrim) 40%, var(--scrim-mid) 70%, var(--scrim-lock) 100%)}
.strip.locked .title{color:var(--muted)}
.strip.static{min-height:224px;cursor:default}
.strip.static:active{transform:none}
.strip .lockmark{position:absolute;right:15px;top:50%;width:16px;height:16px;margin-top:-8px;color:var(--muted)}
.tab.locked{opacity:.5}
.tab .ico.tablock{position:absolute;top:4px;left:50%;width:8px;height:8px;margin-left:12px;color:var(--fg)}
.tab .tbadge{position:absolute;top:0;left:50%;min-width:18px;height:18px;margin-left:8px;padding:0 5px;border-radius:9px;background:var(--blood);color:var(--fg);font:600 11px/18px var(--body);letter-spacing:0;font-variant-numeric:tabular-nums}

/* ---------- campaign: tower ---------- */
.tower{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.tower::before{content:"";position:absolute;left:11px;top:18px;bottom:30px;width:2px;background:var(--line)}
.biome{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding-block:10px}
.node{position:relative;width:14px;height:14px;margin:4px 5px;background:var(--bg);border:2px solid var(--line)}
.b-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.b-head b{font:500 18px/1.15 var(--display)}
.range{font:500 13px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.b-body p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.biome.lock .b-head b{color:var(--muted)}
.biome .lockico{width:16px;height:16px;margin-top:3px;color:var(--muted)}
.biome.now .node{border-color:var(--torch);background:var(--torch)}
.biome.now .b-body{padding:12px;border:1px solid var(--torch-dim);border-radius:6px;background:var(--panel)}
.floorgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.fl{height:38px;display:grid;place-items:center;padding:0;border:0;border-radius:3px;background:var(--seg);color:var(--muted);font:600 15px/1 var(--body);font-variant-numeric:tabular-nums}
button.fl{cursor:pointer}
.fl.done{background:var(--moss-dim);color:var(--moss)}
.fl.now{background:var(--torch);color:var(--torch-ink)}
.fl.sel{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;background:var(--seg)}
.sw.done{background:var(--moss)}
.sw.now{background:var(--torch)}
.go{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 16px;border:1px solid var(--torch-dim);border-radius:6px;background:var(--panel-hi);box-shadow:0 -16px 24px var(--bg)}
.go b{display:block;font:500 20px/1.1 var(--display)}
.go div>span{font-size:12px;color:var(--muted)}

/* ---------- hero: classes & races ---------- */
.face{width:48px;height:48px;display:grid;place-items:center;border-radius:4px;background:var(--seg)}
.face img{width:32px;height:32px}
.face .q{font:700 22px/1 var(--display);color:var(--muted)}
.pill{flex:none;padding:4px 6px;border-radius:3px;font:500 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--moss-dim);color:var(--moss)}
.pill.paid{background:var(--star-dim);color:var(--star)}
.pill.off{background:var(--seg);color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.rowcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left}
.rowcard .face{width:44px;height:44px}
.rowcard b{display:block;font:500 16px/1.15 var(--display)}
.rowcard .sub{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.rowcard.unk{background:transparent;border-style:dashed;cursor:pointer}

/* ---------- almanac ---------- */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.seg button{padding:9px 0;border:0;border-radius:4px;background:transparent;color:var(--muted);font:500 13px/1 var(--display);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel-hi);color:var(--torch)}
.count{margin:0;font-size:13px;color:var(--muted)}
.count b{font:600 17px/1 var(--body);color:var(--fg);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.entry{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:10px 4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:center}
.entry img{width:48px;height:48px}
.entry span{font-size:11px;line-height:1.2}
.entry.unk{background:transparent;border-style:dashed}
.entry.unk i{width:48px;height:48px;display:grid;place-items:center;font:700 22px/1 var(--display);font-style:normal;color:var(--line)}
.entry.unk span{color:var(--muted)}

/* ---------- shop ---------- */
.offer{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.offer b{display:block;font:500 16px/1.15 var(--display)}
.offer .sub{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.offer.feat{grid-template-columns:minmax(0,1fr);gap:10px;padding:16px;border-color:var(--star-dim)}
.offer.feat b{font-size:20px}
.offer.feat .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.slots4{display:flex;gap:6px}
.slots4 span{width:44px;height:44px;display:grid;place-items:center;border-radius:4px;background:var(--seg);font:700 20px/1 var(--display);color:var(--muted)}
.slots4 img{width:32px;height:32px}
.slots4 .plus{background:transparent;border:1px dashed var(--star);color:var(--star)}
.price{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 14px;border:1px solid var(--star-dim);border-radius:18px;background:transparent;color:var(--star);font:500 15px/1 var(--display);cursor:pointer}
.price img{width:16px;height:16px}
.linkbtn{align-self:flex-start;padding:0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- tab bar & toast ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-block:6px 26px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-top:1px solid var(--line);background:var(--bg)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0 4px;border:0;background:transparent;color:var(--muted);font:500 11px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab .ico{width:30px;height:30px}
.tab[aria-current="page"]{color:var(--torch)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:3px;margin-left:-11px;background:var(--torch)}
/* GDE-00 toast: on top of the view, 2 s, at most one waiting, never takes input */
.toast{position:absolute;z-index:5;top:10px;left:16px;right:16px;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:6px;background:var(--panel-hi);font-size:13px;box-shadow:0 10px 30px var(--bezel);pointer-events:none}
.toast[data-type="almanac"]{border-left-color:var(--moss)}
.toast[data-type="recipe"]{border-left-color:var(--torch)}
.toast[data-type="unlock"]{border-left-color:var(--star)}
.toast[data-type="stub"]{border-style:dashed;border-left-style:solid;color:var(--muted)}
.toast.in{animation:toast .2s ease-out}
@keyframes toast{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- notes beside the phone ---------- */
.notes{display:none;flex:0 1 300px;max-width:300px;flex-direction:column;gap:22px}
.brand{font:700 34px/1 var(--display);color:var(--torch)}
.lede{margin:8px 0 0;font-size:15px;color:var(--muted)}
.note h3{margin:0 0 8px;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.note p{margin:0;font-size:14px}
.note code{font-size:12px;color:var(--muted)}
.note a,.note .dev{color:var(--torch);text-underline-offset:3px}
.note .dev{padding:0;border:0;background:none;font-size:14px;text-decoration:underline;cursor:pointer}
.note .cur{color:var(--fg)}
@media (min-width:1000px){.notes{display:flex}}

/* ---------- on a real phone: no frame ---------- */
@media (max-width:599px){
  body{background:var(--bg)}
  .stage{display:block;height:100%;min-height:0;padding:0;background:var(--bg)}
  .device{width:100%;height:100%;aspect-ratio:auto;padding:0;border-radius:0;background:var(--bg);box-shadow:none}
  .app{border-radius:0}
  .statusbar,.homebar{display:none}
  .tabbar{padding-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.view.fwd,.view.rev,.toast.in,.cta.pulse{animation:none}}
</style>

<div class="stage">
  <div class="device">
    <div class="app" id="app">
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="island"></span>
        <span class="sys">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="15" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>

      <header class="topbar">
        <div class="tb-root" id="tbRoot">
          <button class="hero" type="button" data-open="hero">
            <span class="avatar"><img data-spr="player" alt=""></span>
            <span class="who"><b data-t="hero.name"></b><span data-t="hero.class"></span></span>
          </button>
          <div class="purse">
            <span class="chip star" id="stars"><img data-spr="star" alt=""><span>0</span></span>
          </div>
        </div>
        <div class="tb-sub" id="tbSub" hidden>
          <button class="back" id="back" type="button" data-ta="aria.back"><i class="ico" data-ico="back" data-s="2"></i></button>
          <div class="tb-title"><b id="tbTitle"></b><span id="tbSubt"></span></div>
        </div>

  back:  ["...#....","..##....",".#######","########",".#######","..##....","...#...."]

const DPR = Math.max(1, Math.ceil(window.devicePixelRatio || 1));
function maskURL(k, cell) {
  const rows = MASK[k], s = cell * DPR;

const hash = n => { n = (n ^ 61) ^ (n >>> 16); n = Math.imul(n, 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; };

}
const SCENES = {
  campaign(g, W, H) {

    const sx = W - 40;                                     // stairs climbing up to the right
    for (let i = 0; i < 9; i++) {

      g.fillStyle = "#8a765c"; g.fillRect(x, y, 5, 1);
      g.fillStyle = "#2a221d"; g.fillRect(x, y + 1, 1, 5);
    }
    glow(g, W - 4, 0, 72, "255,214,140", .5);             // light from the floor above
    const tx = W - 62, ty = 20;                             // wall torch
    glow(g, tx, ty, 26, "255,170,70", .45);
    g.fillStyle = "#4a3a2a"; g.fillRect(tx - 1, ty + 2, 2, 6); g.fillRect(tx - 2, ty + 2, 4, 1);
    g.fillStyle = "#ff7a3a"; g.fillRect(tx - 1, ty - 1, 2, 3);
    g.fillStyle = "#ffd36a"; g.fillRect(tx, ty - 3, 1, 3); g.fillRect(tx - 1, ty, 1, 1);
    g.drawImage(SPR.player, sx - 16, fy - 16);
    g.fillStyle = "rgba(255,230,180,.6)";
    for (let i = 0; i < 10; i++) { const h = hash(i + 7); g.fillRect(W - 6 - (h % 34), 2 + ((h >> 8) % 30), 1, 1); }
  },
  quests(g, W, H) {
    const fy = H - 6;
    const planks = ["#3b2f23", "#35291f", "#40332a", "#382c21"];
    for (let x = 0, i = 0; x < W; x += 7, i++) { g.fillStyle = planks[hash(i + 3) % 4]; g.fillRect(x, 0, 6, fy); g.fillStyle = "#241b14"; g.fillRect(x + 6, 0, 1, fy); }
    g.fillStyle = "#1c1511"; g.fillRect(0, fy, W, H - fy);
    const bw = 38, bh = Math.min(fy - 8, 26), bx = W - bw - 6, by = 5;   // notice board
    g.fillStyle = "#5a3820"; g.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    g.fillStyle = "#7a5a3a"; g.fillRect(bx, by, bw, bh);
    for (const [nx, ny, nw, nh, c] of [[2,2,10,9,"#e9dfc8"],[14,4,9,11,"#d8ccb0"],[25,1,11,8,"#e9dfc8"],[4,13,9,9,"#cfc2a4"],[25,12,10,10,"#e2d6bc"]]) {

    for (let r = 0; r * 6 < fy; r++) { const off = (r * 7) % 11; for (let x = -off; x < W; x += 11) { g.fillStyle = stones[hash(r * 131 + x + 900) % 4]; g.fillRect(x, r * 6, 10, 5); } }

  camp(g, W, H) {
    const fy = H - 8;
    const stones = ["#2e2a2d", "#2a2629", "#332e31", "#2b272a"];
    for (let r = 0; r * 6 < fy; r++) { const off = (r * 5) % 9; for (let x = -off; x < W; x += 9) { g.fillStyle = stones[hash(r * 211 + x + 300) % 4]; g.fillRect(x, r * 6, 8, 5); } }
    g.fillStyle = "#151215"; g.fillRect(0, fy, W, H - fy);
    g.fillStyle = "#211b1e"; for (let x = 0; x < W; x += 13) g.fillRect(x, fy + 3, 10, 1);

function paintStrip(el) {

const toastEl = $("toast"); let toastBusy = false, toastNext = null;

  if (toastBusy) { toastNext = [type, text]; return; }   // at most one waits; a newer one replaces it
  toastBusy = true;
  toastEl.dataset.type = type; toastEl.textContent = text; toastEl.hidden = false;
  toastEl.classList.remove("in"); void toastEl.offsetWidth; toastEl.classList.add("in");
  setTimeout(() => { toastEl.hidden = true; toastBusy = false; if (toastNext) { const n = toastNext; toastNext = null; toast(...n); } }, 2000);
}
document.addEventListener("click", e => { const s = e.target.closest("[data-stub]"); if (s) toast("stub", t(s.dataset.stub)); });

/* ================= design-note links: new player / demo save after floor 1 (the Telegram build drops the notes) ================= */
document.querySelectorAll("[data-dev]").forEach(b => b.addEventListener("click", () => {
  try {
    const d = b.dataset.dev;
    if (d === "clear") { ["gamey.save", "gamey.once", "gamey.tab"].forEach(k => localStorage.removeItem(k)); sessionStorage.removeItem("gamey.sid"); }
    if (d === "demo") localStorage.setItem("gamey.save", JSON.stringify(DEMO_SAVE));
    if (d === "make") { const s = save || DEMO_SAVE; s.makeable = (s.makeable | 0) + 1; localStorage.setItem("gamey.save", JSON.stringify(s)); }
  } catch (e) {}
  location.reload();
}));

/* ================= session ================= */
if (!readJSON("gamey.events", []).some(ev => ev && ev.e === "session_start" && ev.sid === sid)) {   // once per sid, whichever screen made it
  track("session_start", { is_first: !save && !once.has("home.session"), source: source() });
  once.add("home.session");
}
show();
if (tab === "almanac") almView();
})();
