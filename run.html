<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tg.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0a0c}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* the Telegram build is always the phone layout: no device frame, no design notes */
.stage{display:block!important;height:100%!important;min-height:0!important;padding:0!important}
.device{width:100%!important;height:100%!important;aspect-ratio:auto!important;padding:0!important;border-radius:0!important;box-shadow:none!important}
.app{border-radius:0!important}
.statusbar,.homebar,.notes{display:none!important}
/* in full screen, stay clear of the phone's status bar and Telegram's own buttons */
:root{--tg-top:calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));--tg-bottom:var(--tg-safe-area-inset-bottom, 0px)}
.top{padding-top:calc(var(--tg-top) + 10px)!important}
.bottom{padding-bottom:calc(var(--tg-bottom) + 10px)!important}
.topbar{padding-top:calc(var(--tg-top) + 8px)!important}
.tabbar{padding-bottom:calc(var(--tg-bottom) + 8px)!important}
.sheet{padding-bottom:calc(var(--tg-bottom) + 16px)!important}
</style>
</head>
<body>
<title>Game Y Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Floor 1 (docs/GDE/GDE-03-run-floor-1.md) in the room view: one room at a time from above, Ari and the foes as PixelLab
   sprites, labels in HTML over the canvas. Ten rooms: the cold cellar → a damp corridor → the narrow passage with the snake
   (nothing to fight with: flee) → the dead end with the chest (a blunt dagger, a whetstone; the snake catches up) → the
   corridor, the closet (a locked box), the empty vault, the alchemy table → the heavy door → the lair with the dire wolf and
   the stairs up, where gamey.save is written. The first-person version is archive/03-run-floor-1-first-person.html.
   Layout: header, room title + turn, goal bar, the room, health and vita, the weapon in hand, then four moves in a 2×2 grid
   during a fight or the bag outside one. Desktop = centred column; phone and Telegram = edge to edge, rooms without side
   doors crop their side walls. In Telegram (tools/tg.js) the page scrolls inside .app and keeps clear of the safe areas. */
:root{
  --bg:#111316;
  --panel:#15181c;
  --panel-hi:#1b1e23;
  --line:#262a30;
  --line-hi:#363b42;
  --fg:#ece8e1;
  --soft:#bfc3c8;
  --muted:#8c9198;
  --dim:#555a61;
  --gold:#e3b55f;
  --gold-soft:#e8cf98;
  --teal:#86d0b0;
  --teal-hi:#a5e4c6;
  --teal-bg:#16211c;
  --teal-line:#2c4538;
  --hp:#df8c8c;
  --hp-trail:#f4cfcf;
  --hp-track:#2c2325;
  --vita:#a08ce0;
  --vita-hi:#c9bdf2;
  --vita-off:#3e3658;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block;flex:none}
a{color:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.px{image-rendering:pixelated;flex:none}
.drop{display:inline-block;width:.62em;height:.62em;background:var(--vita);border-radius:50% 0 50% 50%;rotate:-45deg;flex:none}
@keyframes blink{50%{opacity:.35}}

/* .app scrolls itself: the Telegram build fixes html and body to the screen */
.app{max-width:840px;height:100%;min-height:100vh;margin:0 auto;padding:16px 24px calc(var(--tg-bottom, 0px) + 24px);border-inline:1px solid #1c1f23;overflow-y:auto;overscroll-behavior:contain;-webkit-user-select:none;user-select:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.brand{display:flex;align-items:center;gap:18px}
.logo{position:relative;width:42px;height:44px}
.logo i{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.logo b{position:absolute;left:9px;top:-3px;font:700 32px/1 var(--mono);color:var(--gold)}
.logo em{position:absolute;left:23px;top:19px;font:700 22px/1 var(--mono);font-style:normal;color:#f3efe8}
.bname b{display:block;font:700 17px/1 var(--mono);letter-spacing:.16em}
.bname small{display:block;margin-top:8px;font:500 11px/1 var(--mono);letter-spacing:.5em;color:var(--muted)}
.tools button{display:grid;place-items:center;width:40px;height:40px;border-radius:6px;color:#a6aab0}
.tools button:hover{color:var(--fg)}
.tools .ic{width:24px;height:24px;stroke-width:1.6}

/* room title */
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-top:22px}
.crumb{display:flex;align-items:center;gap:10px;font:500 12.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.crumb i{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.crumb span{color:var(--dim)}
h1{margin:16px 0 0;font:600 30px/1.1 var(--sans);letter-spacing:-.01em;color:#f2eee7}
.turn{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--teal-bg);border:1px solid var(--teal-line);border-radius:8px;transition:background .2s,border-color .2s,opacity .3s}
.turn span{font:500 13px/1 var(--mono);color:#97c4ae}
.turn b{font:700 20px/1 var(--mono);color:var(--teal-hi)}
.turn.foe{background:#241618;border-color:#5a3134}
.turn.foe span,.turn.foe b{color:#f0a3a3}
.turn.hide{opacity:0;visibility:hidden}
.turn.pop b{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.35);color:#fff}}

/* goal */
.goal{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;margin-top:22px;padding:8px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;text-align:left}
.goal:hover{border-color:var(--line-hi)}
.goal>.ic{color:var(--gold-soft)}
.goal .gt{flex:1;min-width:0;font-size:15px;color:#e6e2da}
.goal b{font:700 15px/1 var(--mono);letter-spacing:.06em;color:var(--gold)}
.goal .chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.goal[aria-expanded="true"] .chev{transform:rotate(90deg)}
.goals{display:flex;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.goals li{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--muted)}
.goals li i{width:14px;height:14px;border:1px solid var(--dim);border-radius:3px}
.goals li.done{color:var(--fg)}
.goals li.done i{background:var(--teal);border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--panel)}

/* the room: canvas below, labels above. --px = one art pixel, set from JS (the phone crop changes it) */
.scene{--px:calc(100cqw / 320);position:relative;margin-top:14px;aspect-ratio:320/124;background:#0d0e10;border:1px solid var(--line);border-radius:10px;overflow:hidden;container-type:inline-size}
.scene canvas{position:absolute;top:0;left:0;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
.scene.shake{animation:shake .32s}
.scene.roar{animation:shake .5s 2}
@keyframes shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,0)}80%{transform:translate(2px,1px)}}
.hurtfx{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 calc(var(--px)*18) rgba(214,60,66,.65);opacity:0}
.hurtfx.on{animation:hurt .5s ease-out}
@keyframes hurt{0%{opacity:1}100%{opacity:0}}
.fade{position:absolute;inset:0;z-index:3;background:#0b0c0e;opacity:0;pointer-events:none;transition:opacity .25s}
.fade.on{opacity:1}
.at{position:absolute;translate:-50% 0;white-space:nowrap;pointer-events:none}
.gone{opacity:0!important;transition:opacity .4s}
.tag{position:absolute;left:2.3%;top:4.6%;display:flex;align-items:center;gap:.9em;font:700 max(8px,calc(var(--px)*3.3))/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#9a9fa6;text-shadow:0 1px 0 #000;pointer-events:none}
.tag b{padding:.35em .5em;border:1px solid #5d6269;font-weight:500;color:#b4b9bf;background:rgba(10,11,13,.55)}
/* the minimap: rooms seen so far, and the ways out of them */
.mmap{position:absolute;right:2.3%;top:4.6%;width:max(66px,calc(var(--px)*30));padding:4px;background:rgba(10,11,13,.78);border:1px solid #2c3036;border-radius:5px;pointer-events:none}
.mmap svg{width:100%;height:auto}
.flabel{display:flex;flex-direction:column;align-items:center;gap:.45em;transition:opacity .4s}
.flabel .nm,.olabel{display:flex;align-items:center;font:600 max(9.5px,calc(var(--px)*5))/1 var(--sans);color:#efebe4;text-shadow:0 1px 0 #000,0 0 4px #000}
.olabel{transition:opacity .3s}
.flabel .nm>span{margin-left:.5em;font-family:var(--mono);font-weight:700;color:var(--hp)}
.flabel.sel .nm{color:var(--gold)}
.fbar{position:relative;width:calc(var(--px)*30);height:max(3px,calc(var(--px)*1.1));background:#4b2f31;border-radius:2px;overflow:hidden}
.fbar>*,.bar>*{position:absolute;top:0;bottom:0;left:0;display:block;text-decoration:none}
.fbar s{background:var(--hp-trail);transition:width .5s ease .3s}
.fbar i{background:#d48686;transition:width .2s}
.fbar b{background:#fff;animation:blink .8s infinite}
.chip{display:flex;align-items:center;gap:.55em;padding:.55em .75em;background:rgba(14,16,19,.92);border:1px solid #2c3036;border-radius:4px;font:500 max(8.5px,calc(var(--px)*4.3))/1 var(--sans);color:#d9d6d0;transition:opacity .4s,border-color .2s,scale .2s}
.chip svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.warn{border-color:#7a3c40;color:#f4b9b9;background:rgba(40,16,19,.92)}
.chip.prep{border-color:#6b5a2c;color:var(--gold-soft)}
.chip.miss{border-color:var(--teal-line);color:var(--teal-hi);text-decoration:line-through}
.chip.act{border-color:var(--gold);scale:1.12}
.say{position:absolute;translate:-50% 0;max-width:46%;padding:.55em .8em;background:#efe9de;color:#1d1915;border-radius:6px;font:500 max(9.5px,calc(var(--px)*4.3))/1.3 var(--sans);text-align:center;pointer-events:none;animation:sayin .2s ease-out}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;translate:-50% 0;border:5px solid transparent;border-bottom:0;border-top-color:#efe9de}
@keyframes sayin{from{opacity:0;transform:translateY(4px)}}
/* the narrator: one italic line under the room, once per player and event */
.narr{min-height:1.35em;margin:8px 0 -6px;font:italic 400 14px/1.35 var(--sans);color:#cfc7b6;text-align:center;opacity:0;transition:opacity .5s}
.narr.on{opacity:1}
/* toasts: the almanac and recipes, over the room for two seconds */
.toast{position:absolute;left:50%;top:17%;z-index:2;translate:-50% 0;padding:.5em .9em;background:rgba(20,18,12,.94);border:1px solid #6b5a2c;border-radius:6px;font:600 max(9.5px,calc(var(--px)*4))/1 var(--sans);color:var(--gold-soft);white-space:nowrap;pointer-events:none;animation:toastin .25s ease-out}
@keyframes toastin{from{opacity:0;transform:translateY(-6px)}}
.hit{position:absolute;border-radius:6px}
.hit:disabled{cursor:default}
.float{position:absolute;translate:-50% -50%;display:flex;align-items:center;gap:.35em;font:700 max(13px,calc(var(--px)*6.5))/1 var(--mono);color:#fff;white-space:nowrap;text-shadow:0 2px 0 #000,0 0 6px rgba(0,0,0,.6);pointer-events:none;animation:rise .95s ease-out forwards}
.float.big{font-size:max(17px,calc(var(--px)*9));color:var(--gold-soft)}
.float.hurt{color:#f09595}
.float.miss{color:var(--teal-hi);font-family:var(--sans);font-size:max(11px,calc(var(--px)*5))}
.float.item{font:600 max(11px,calc(var(--px)*4.6))/1 var(--sans);color:var(--gold-soft);animation-duration:1.6s}
.float.item img{width:max(16px,calc(var(--px)*8));height:max(16px,calc(var(--px)*8))}
@keyframes rise{0%{opacity:0;transform:translateY(20%) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-120%) scale(1)}}

/* health, vita */
.stats{display:grid;grid-template-columns:1fr 180px;gap:34px;margin-top:16px}
.stats .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lbl{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--soft)}
.lbl svg{width:13px;height:13px;fill:var(--hp)}
.lbl .drop{width:10px;height:10px}
.val{display:flex;align-items:baseline;gap:4px;font:500 14px/1 var(--mono);color:var(--muted)}
.val b{font-size:17px;font-weight:700;color:var(--fg)}
.val em{margin-right:8px;padding:2px 6px;border-radius:4px;background:#2d1a1c;font-style:normal;font-weight:700;font-size:12.5px;color:#f09595}
.vt .val b{color:var(--vita-hi)}
.bar{position:relative;height:7px;margin-top:11px;background:var(--hp-track);border-radius:4px;overflow:hidden}
.bar s{background:var(--hp-trail);border-radius:4px;transition:width .55s ease .35s}
.bar i{background:var(--hp);border-radius:4px;transition:width .25s}
.bar b{background:repeating-linear-gradient(-45deg,#ffb0b0 0 3px,#a8484e 3px 6px);animation:blink 1.1s infinite}
.pips{display:flex;justify-content:space-between;align-items:center;height:7px;margin-top:11px;padding:0 3px}
.pips i{width:11px;height:11px;border:1.5px solid var(--vita-off);border-radius:50% 0 50% 50%;rotate:-45deg;transition:background .25s,border-color .25s}
.pips i.on{background:var(--vita);border-color:var(--vita)}
.pips i.spend{animation:blink .7s infinite}

/* weapon in hand */
.weapon{display:flex;align-items:center;justify-content:space-between;height:46px;margin-top:10px}
.wl{display:flex;align-items:center;gap:12px;font-size:15px;color:#e3dfd8;white-space:nowrap}
.wl img{width:32px;height:32px;margin:-4px}
.wl em{width:1px;height:16px;background:var(--line-hi)}
.wl span{font:500 13.5px/1 var(--mono);color:var(--muted)}
.wl span i{font-style:normal;color:var(--gold);letter-spacing:.05em}
.wl.none{color:var(--dim)}
.wl.none .hand{display:grid;place-items:center;width:24px;height:24px;border:1px dashed var(--dim);border-radius:5px}
.chron{display:flex;align-items:center;gap:6px;min-height:40px;font-size:14px;color:#c9ccd1}
.chron:hover{color:var(--fg)}
.chron .ic{width:14px;height:14px}

/* moves: four slots, 2×2; a slot fills when the weapon in hand gives a move */
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.mv{position:relative;display:flex;align-items:center;gap:14px;height:76px;padding:0 16px;background:var(--panel-hi);border:1px solid var(--line-hi);border-radius:8px;text-align:left;transition:background .15s,border-color .15s,color .15s,opacity .2s}
.mv img{width:40px;height:40px}
.mv .mt{display:flex;flex-direction:column;gap:4px;min-width:0}
.mv b{font-size:16px;font-weight:600;line-height:1.15}
.mv small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.mv .cost{position:absolute;top:9px;right:11px;display:flex;align-items:center;gap:5px;font:700 13px/1 var(--mono);color:var(--vita-hi)}
.mv .cost .drop{width:8px;height:8px}
.mv .newb{position:absolute;top:-7px;left:12px;padding:2px 6px;background:var(--gold);color:#1a140a;border-radius:4px;font:700 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.mv kbd{position:absolute;bottom:8px;right:11px;font:500 11px/1 var(--mono);color:var(--dim)}
.mv:hover{border-color:#4a5058}
.mv:active{transform:translateY(1px)}
.mv.primary{background:#6b655d;border-color:#6b655d;color:#f3efe8}
.mv.primary small,.mv.primary kbd{color:#d9d3c9}
.mv.primary:hover{background:#787168;border-color:#787168}
.mv.off{background:#17191c;border-color:#212428;color:#50555c;cursor:default}
.mv.off img{opacity:.35;filter:grayscale(1)}
.mv.off small,.mv.off .cost{color:#464b51}
.mv.off .cost .drop{background:#464b51}
.mv.wait{opacity:.5;cursor:default}
.mv.empty{justify-content:center;background:none;border:1px dashed #2a2e34;color:#41464d;font-size:13px;cursor:default}
.mv.empty:hover{border-color:#2a2e34}

/* bag: what Ari carries, shown instead of the moves outside a fight */
.bagp{margin-top:8px;padding:12px 14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.bagp header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--soft)}
.bagp header span{font:500 13px/1 var(--mono);color:var(--muted)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.cell{position:relative;display:grid;place-items:center;width:52px;height:52px;background:var(--panel-hi);border:1px solid var(--line);border-radius:8px}
.cell img{width:32px;height:32px}
.cell>b{position:absolute;right:4px;bottom:3px;font:700 11px/1 var(--mono);color:var(--fg);text-shadow:0 1px 0 #000}
.cell>u{position:absolute;left:3px;top:3px;padding:1px 3px;background:var(--gold);color:#1a140a;border-radius:3px;font:700 8px/1 var(--mono);text-decoration:none;text-transform:uppercase}
.cell.new{animation:newin .6s ease-out}
@keyframes newin{0%{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.bagp .none{font-size:13.5px;color:var(--dim)}
button.cell:not(:disabled):hover{border-color:#4a5058}

/* flee */
.belt{display:flex;justify-content:flex-end;margin-top:10px}
.flee{display:flex;align-items:center;gap:8px;height:52px;padding:0 18px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;color:var(--soft)}
.flee:hover:not(:disabled){border-color:#4a5058;color:var(--fg)}
.flee:disabled{opacity:.4;cursor:default}
.flee.hot{border-color:var(--gold);color:var(--gold-soft);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,181,95,.45)}100%{box-shadow:0 0 0 10px rgba(227,181,95,0)}}
.flee .ic{width:18px;height:18px}

/* sheets: chronicle, the alchemy table, waking, falling, the end of the floor */
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(8,9,11,.72)}
.sheet{width:min(440px,100%);max-height:84vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-hi);border-radius:10px;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header b{font-size:17px;font-weight:600}
.sheet header button{display:grid;place-items:center;width:36px;height:36px;color:var(--muted)}
.sheet .body{overflow:auto;padding:12px 18px 16px}
.logl{display:flex;gap:14px;padding:6px 0;font-size:14px;color:var(--soft);border-bottom:1px solid #1d2024}
.logl:last-child{border:0}
.logl em{font:500 12px/1.6 var(--mono);font-style:normal;color:var(--dim)}
.lead{margin:2px 0 16px;color:var(--soft)}
.lead i{display:block;margin-top:8px;color:var(--muted)}
.sum{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:2px 0 14px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font:600 14px/1.4 var(--mono)}
.loot{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.loot .cell{width:46px;height:46px}
.btn{display:grid;place-items:center;width:100%;height:48px;background:var(--gold);color:#1a140a;border-radius:8px;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.craft .slots{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}
.craft .slots>i{font:500 18px/1 var(--mono);font-style:normal;color:var(--muted)}

const OUT = "#111215";
// rows of palette letters; "." is empty. Every sprite gets a 1-px dark outline around its shape.
function sprite(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)) + 2, h = rows.length + 2;
  const grid = [[...".".repeat(w)], ...rows.map(r => [".", ...r.padEnd(w - 2, "."), "."]), [...".".repeat(w)]];
  const full = (i, j) => grid[j] && grid[j][i] && grid[j][i] !== ".";
  const c = canvas(w, h), x = c.getContext("2d");
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const ch = grid[j][i];
    if (ch !== ".") { x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); }
    else if (full(i - 1, j) || full(i + 1, j) || full(i, j - 1) || full(i, j + 1)) { x.fillStyle = OUT; x.fillRect(i, j, 1, 1); }
  }
  return c;
}
// the shared 16×16 item set draws its own edges (mockups/05-almanac.html)
function mk(rows, pal) {
  const c = canvas(rows[0].length, rows.length), x = c.getContext("2d");
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (ch !== "." && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
  return c;
}
function tint(src, col) {
  const c = canvas(src.width, src.height), x = c.getContext("2d");
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = "source-atop"; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function ring(rx, ry, col) {
  const c = canvas(rx * 2 + 1, ry * 2 + 1), x = c.getContext("2d");
  x.fillStyle = col;
  const put = (a, b) => x.fillRect(Math.round(a + rx), Math.round(b + ry), 1, 1);
  for (let i = -rx; i <= rx; i++) { const j = ry * Math.sqrt(1 - (i / rx) ** 2); put(i, j); put(i, -j); }
  for (let j = -ry; j <= ry; j++) { const i = rx * Math.sqrt(1 - (j / ry) ** 2); put(i, j); put(-i, j); }
  return c;
}
function blob(rx, ry, col) {
  const c = canvas(rx * 2 + 1, ry * 2 + 1), x = c.getContext("2d");
  x.fillStyle = col;
  for (let j = -ry; j <= ry; j++) { const i = Math.round(rx * Math.sqrt(1 - (j / (ry + .5)) ** 2)); x.fillRect(rx - i, j + ry, i * 2 + 1, 1); }
  return c;
}

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function buildShade(id, spot) {
  const N = NODES[id], c = canvas(VW, VH), x = c.getContext("2d"), img = x.createImageData(VW, VH);
  const [hx, hf] = SPOTS[spot];
  const lights = [...N.torches.map(t => [t + 3, 28, 70, 1]), [hx - 11, hf - 36, 80, .85]];
  if (N.doors.N) lights.push([160, 24, 46, .5]);
  if (N.exit) lights.push([160, 10, 90, 1.2]);
  const base = id === "I" || id === "H" ? .46 : .36;
  for (let j = 0; j < VH; j++) for (let i = 0; i < VW; i++) {
    let lit = 0;
    for (const [lx, ly, r, k] of lights) { const d = Math.hypot(i - lx, (j - ly) * 1.6) / r; if (d < 1) lit += (1 - d) * k; }
    const ex = (i - VW / 2) / (VW / 2), ey = (j - VH / 2) / (VH / 2);
    const dark = clamp(base + (ex ** 4 + ey ** 4) * .32 - lit * .5, 0, .74);
    const q = Math.floor(dark * 8 + BAYER[(j & 3) * 4 + (i & 3)] / 16) / 8;
    const o = (j * VW + i) * 4;
    img.data[o] = 5; img.data[o + 1] = 6; img.data[o + 2] = 11; img.data[o + 3] = q * 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

}
async function settleDeaths() {
  for (const k of foesHere()) {
    const f = S.foes[k], G = geom(k), F = FOE[k];
    if (f.hp) continue;
    f.dead = true; V.die[k] = performance.now();
    S.wins[k] = (S.wins[k] || 0) + 1;
    burst(G.cx, G.mid, F.bits, 22);
    S.goals[k === "snake" ? 0 : 1] = 1;
    log(STR.beaten(STR.foe[k]));
    addItem(F.loot, "foe", G.cx, G.mid, 250);
    for (const e of [UI[k].label, UI[k].chip]) e.classList.add("gone");
    UI[k].hit.disabled = true;
    S.target = foesHere()[0] || null;
    render(); await wait(380);
  }
  if (fight()) return false;
  endFight("win");
  buzz("ok");
  S.vita = 3; S.turn = 1; S.newMoves.clear();
  render();
  return true;
}
async function act(m) {
  if (S.busy || S.over || !usable(m)) return;
  const M = MOVE[m](), k = S.target, G = geom(k);
  S.busy = true; S.preview = null; S.newMoves.delete(m);
  S.vita -= M.vita;
  if (S.fight) S.fight.turns++;
  if (S.hand === "dagger") narrate("dagger", STR.narr.dagger);
  track("move_used", { move: m, foe_intent: intent(k).k });
  V.lunge.hero = { t0: performance.now(), dx: Math.sign(G.cx - S.hx) * 6, dy: -3 };
  render(); await wait(130);
  if (m === "reflex" && !counters(k)) {
    float(S.hx, S.hf - 46, STR.wasted, "miss");
    log(`${M.name} · ${STR.wasted}`);
  } else {
    const dmg = DEF[S.hand].dmg * (m === "reflex" ? 2 : 1);
    if (m === "reflex") { S.foes[k].dodged = true; replay(scene, "shake"); }
    hitFoe(k, dmg, m === "reflex");
    log(`${M.name} → ${STR.foe[k]} · −${dmg}`);
  }
  render(); await wait(420);
  if (await settleDeaths()) { S.busy = false; return render(); }
  await foesTurn();
}
async function foesTurn() {
  render();
  await wait(150);
  for (const k of foesHere()) {
    const F = FOE[k], f = S.foes[k], mv = intent(k), G = geom(k);
    S.acting = k; render();
    await wait(220);
    if (mv.dmg) {
      V.lunge[k] = { t0: performance.now(), dx: Math.sign(S.hx - G.cx) * (mv.lunge ? 12 : 5), dy: mv.lunge ? 6 : 3 };
      await wait(140);
      if (f.dodged) {
        float(S.hx, S.hf - 46, STR.dodge, "miss");
        log(`${STR.foe[k]}: ${STR.intent[mv.k].toLowerCase()} · ${STR.dodge}`);
      } else {
        S.hp = Math.max(0, S.hp - mv.dmg);
        V.hit.hero = performance.now();
        float(S.hx, S.hf - 46, "−" + mv.dmg, "hurt");
        replay(scene, "shake"); replay($("hurtfx"), "on");
        buzz(mv.dmg >= 5 ? "heavy" : "medium");
        log(`${STR.foe[k]}: ${STR.intent[mv.k].toLowerCase()} · −${mv.dmg}`);
      }
    } else log(`${STR.foe[k]}: ${STR.intent[mv.k].toLowerCase()}`);
    f.i = (f.i + 1) % F.moves.length;
    f.dodged = false;
    if (intent(k).prep) narrate("leap", STR.narr.leap);
    S.acting = null; render();
    await wait(420);
    if (!S.hp) break;
  }
  if (!S.hp) return fall();
  S.turn++;
  S.vita = Math.min(S.vitaMax, S.vita + 1);
  S.busy = false;
  replay($("turnBox"), "pop");
  render();
}
// on floor 1 a fall costs nothing: Ari gets up, the wolf waits behind its door again (GDE-03 §9)
async function fall() {
  S.busy = true; S.deaths++;
  track("death", { floor: FLOOR, room: S.room, foe: foesHere()[0] || null });
  endFight("death");
  buzz("error");
  render();
  await wait(500);
  const line = once("narrate.fell") ? `<i>${STR.narr.fell}</i>` : "";
  openModal(STR.fell, `<p class="lead">${line}</p><button class="btn" id="getUp">${STR.getUp}</button>`, "fall");
  $("getUp").onclick = getUp;
}
function getUp() {
  closeModal();
  const k = foesHere()[0];
  S.hp = S.max; S.vita = 3; S.turn = 1;
  if (k) Object.assign(S.foes[k], { hp: FOE[k].max, i: 0, dodged: false });
  if (S.room === "H") { S.room = "G"; S.spot = "N"; [S.hx, S.hf] = SPOTS.N; }
  S.busy = false;
  track("room_enter", { floor: FLOOR, room: S.room, t_from_run_start: runSecs() });
  mountRoom(); render();
  if (fight()) startFight();
}
// flee: from the narrow passage into the dead end (the snake follows), from the lair back through the heavy door
const FLEE = { B: "N", H: "S" };
async function flee() {
  const dir = FLEE[S.room];
  if (S.busy || S.over || !fight() || !dir) return;
  log(STR.fled);
  track("flee", { floor: FLOOR, foe: foesHere()[0] });
  endFight("flee");
  if (S.room === "B") { S.foes.snake.at = "C"; S.foes.snake.here = false; }
  await go(dir, true);
}
// the snake catches up one turn later: right after the chest, or at the door back out
async function snakeArrives() {
  const f = S.foes.snake;
  if (f.dead || f.at !== "C" || f.here) return;
  S.busy = true;
  f.here = true; f.i = 0;
  V.enter.snake = performance.now();
  buzz("medium");
  mountRoom(); render();
  await wait(550);
  S.busy = false;
  startFight();
}

/* ================= things in the rooms ================= */
function usableObj(k) {
  if (k === "chest") return !S.chest;
  if (k === "box") return !S.boxTaken;
  if (k === "climb") return S.foes.wolf.dead;
  return !fight();
}
function useObj(k) {
  if (S.busy || S.over || !usableObj(k)) return;
  ({ chest: openChest, box: takeBox, table: openTable, climb })[k]();
}
async function openChest() {
  S.chest = true; S.busy = true;
  burst(160, 52, ["#f4d27c", "#dcaa48", "#fff2c0"], 14, .05);
  log(STR.chestOpen);
  track("chest_open", { item: ["dagger", "stone"], source: S.room });
  addItem("dagger", S.room, 160, 40, 150);
  addItem("stone", S.room, 160, 40, 700);
  render();
  await wait(1100);
  S.busy = false;
  if (S.foes.snake.at === "C" && !S.foes.snake.here) await snakeArrives();
  render();
}
function takeBox() {
  S.boxTaken = true;
  addItem("lockbox", S.room, 221, 80);
  narrate(null, STR.boxLocked);
  render();
}

/* the stairs are the save point: gamey.save v1, exactly as in docs/GDE/CONTRACT.md */
function loadSave() { const s = load("gamey.save", null); return s && s.v === 1 ? s : null; }
function writeSave(secs, prev) {
  const old = prev || {}, bag = [];
  const add = (key, n) => { const b = bag.find(x => x.key === key); if (b) b.n += n; else bag.push({ key, n }); };
  // nothing saved earlier is lost (GDE-00): the saved bag, camp crafts included, plus this run's bag and hand on top
  (Array.isArray(old.bag) ? old.bag : []).forEach(x => { if (x && typeof x.key === "string" && x.n > 0) add(x.key, x.n); });
  S.bag.forEach(b => add(b.k, b.n));
  if (S.hand) add(S.hand, 1);
  bag.forEach(x => { if (UNIQUE.includes(x.key)) x.n = 1; });
  const have = k => (bag.find(x => x.key === k) || { n: 0 }).n;
  const creatures = { ...(old.creatures || {}) };
  S.met.forEach(k => { const c = creatures[k] || { seen: 0, wins: 0 }; creatures[k] = { seen: c.seen + 1, wins: c.wins + (S.wins[k] || 0) }; });
  const save = {
    ...old,   // fields this file doesn't know stay as the camp wrote them
    v: 1,
    floor: Math.max(FLOOR, old.floor || 0),
    bag,
    hand: S.hand || old.hand || null,   // an empty hand at the stairs keeps the saved weapon and its moves
    moves: S.hand ? movesOf(S.hand) : (Array.isArray(old.moves) ? old.moves : []),
    creatures,
    recipes: [...new Set([...(old.recipes || []), ...S.recipes])],
    camp: [...new Set([...(old.camp || []), ...(CAMP_UNLOCK[FLOOR] || [])])],
    makeable: CAMP_RECIPES.filter(r => r.in.every(([k, n]) => have(k) >= n)).length,   // the Camp badge in 01
    time: { ...(old.time || {}), [FLOOR]: secs }
  };
  store("gamey.save", save);
}
async function climb() {
  S.busy = true; render();
  await walk([160, 40], 700);
  V.gone = true;
  $("fade").classList.add("on");
  await wait(300);
  S.goals[2] = 1; S.over = true; S.busy = false;
  const secs = runSecs(), prev = loadSave(), fresh = [...S.met].filter(k => !(prev && prev.creatures && prev.creatures[k]));
  writeSave(secs, prev);
  track("floor_clear", { floor: FLOOR, duration_s: secs, deaths: S.deaths });
  buzz("ok");
  render();
  openModal(STR.cleared, `<dl class="sum"><dt>${STR.time}</dt><dd>${pad2(secs / 60 | 0)}:${pad2(secs % 60)}</dd><dt>${STR.found}</dt><dd>${S.found.length}</dd>${
    fresh.length ? `<dt>${STR.almanac}</dt><dd>${fresh.map(k => STR.foe[k]).join(", ")}</dd>` : ""}</dl>
    <div class="loot">${S.found.map(k => `<span class="cell" title="${NAME(k)}">${itemImg(k)}</span>`).join("")}</div>
    <a class="btn" href="index.html">${STR.cont}</a>`, "end");
}

/* the alchemy table: two cells; what fits something else in hand or in the bag is lit, what it makes stays hidden */
const owned = k => (S.hand === k ? 1 : 0) + (S.bag.find(b => b.k === k) || { n: 0 }).n;
const free = k => owned(k) - S.slots.filter(s => s === k).length;
const fits = k => RECIPES.some(r => r.slice(0, 2).includes(k) && r.slice(0, 2).every(i => owned(i) > 0));
const match = () => RECIPES.find(([a, b]) => S.slots.includes(a) && S.slots.includes(b));
function openTable() {
  S.slots = [null, null]; S.made = null;
  openModal(STR.tableTitle, `<div class="craft" id="craft"></div>`, "table");
  renderCraft();
}
function renderCraft() {
  const m = match();
  const slot = i => `<button class="slot${S.slots[i] ? " full" : ""}" data-s="${i}" aria-label="${S.slots[i] ? NAME(S.slots[i]) : STR.empty}">${S.slots[i] ? itemImg(S.slots[i]) : ""}</button>`;
  const items = [...(S.hand ? [S.hand] : []), ...S.bag.map(b => b.k)].filter((k, i, a) => a.indexOf(k) === i && free(k) > 0);
  $("craft").innerHTML = `<div class="slots">${slot(0)}<i>+</i>${slot(1)}<i>=</i><div class="slot res${S.made ? " made" : m ? " ready" : ""}">${
    S.made ? itemImg(S.made) : m ? "?" : ""}</div></div>${S.made ? `<p class="made">${NAME(S.made)}<small>${STR.discovered}</small></p>` : ""}
    <button class="btn" id="mix"${m ? "" : " disabled"}>${STR.mix}</button>
    <div class="grid">${items.map(k => `<button class="cell${fits(k) ? " fit" : ""}" data-k="${k}" title="${NAME(k)}" aria-label="${NAME(k)}">${itemImg(k)}${
      S.hand === k ? `<u>${STR.inHand}</u>` : ""}${free(k) > 1 ? `<b>${free(k)}</b>` : ""}</button>`).join("")}</div>`;
}
function mix() {
  const r = match();
  if (!r) return;
  const [a, b, out] = r, known = (loadSave() || {}).recipes || [], discovered = !known.includes(out) && !S.recipes.includes(out);
  let toHand = false;
  for (const k of [a, b]) {
    if (S.hand === k) { S.hand = null; toHand = true; continue; }
    const it = S.bag.find(x => x.k === k); if (--it.n <= 0) S.bag.splice(S.bag.indexOf(it), 1);
  }
  S.slots = [null, null];
  if (toHand) setHand(out); else { const it = S.bag.find(x => x.k === out); if (it) it.n++; else S.bag.push({ k: out, n: 1 }); }
  S.fresh = out;
  if (!S.recipes.includes(out)) S.recipes.push(out);
  log(STR.made(NAME(out)));
  track("fuse", { recipe: out, auto: false, discovered });
  buzz("ok");
  S.made = out;
  renderCraft(); render();
}
$("mBody").addEventListener("click", e => {
  if (!$("craft")) return;
  if (e.target.closest("#mix")) return mix();
  const c = e.target.closest("[data-k]"), s = e.target.closest("[data-s]");
  if (c) { const i = S.slots.indexOf(null); if (i >= 0) { S.slots[i] = c.dataset.k; S.made = null; buzz("tick"); } }
  if (s) S.slots[+s.dataset.s] = null;
  renderCraft();
});

/* ================= panels ================= */
function bar(trail, fill, ghost, now, max, lose) {
  trail.style.width = fill.style.width = now / max * 100 + "%";
  ghost.style.left = (now - lose) / max * 100 + "%";
  ghost.style.width = lose / max * 100 + "%";
}
function renderMap() {
  const known = id => S.visited[id] || Object.values(NODES[id].doors).some(o => S.visited[o]);
  const cx = id => NODES[id].at[0] * 15 + 6, cy = id => NODES[id].at[1] * 12 + 4.5;
  let svg = "";
  EDGES.forEach(([a, b]) => { if ((S.visited[a] || S.visited[b]) && known(a) && known(b)) svg += `<line x1="${cx(a)}" y1="${cy(a)}" x2="${cx(b)}" y2="${cy(b)}" stroke="#6a7078" stroke-width="1.4"/>`; });
  for (const id in NODES) {
    if (!known(id)) continue;
    const cur = id === S.room, seen = S.visited[id];
    svg += `<rect x="${cx(id) - 5}" y="${cy(id) - 3.5}" width="10" height="7" rx="1" fill="${cur ? "#4a3d22" : seen ? "#353a42" : "#111316"}" stroke="${cur ? "#e3b55f" : seen ? "#8a9098" : "#5a6068"}"${seen ? "" : ` stroke-dasharray="1.5 1.2"`} stroke-width="1"/>`;
    const foe = Object.keys(FOE).some(k => S.foes[k].at === id && !S.foes[k].dead);
    const dot = seen && (foe ? "#cf4656" : id === "C" && !S.chest ? "#e3b55f" : id === "I" && !S.boxTaken ? "#e3b55f" : id === "F" ? "#a08ce0" : id === "H" ? "#efe9de" : null);
    if (dot) svg += `<circle cx="${cx(id)}" cy="${cy(id)}" r="1.6" fill="${dot}"/>`;
  }
  $("mmap").innerHTML = `<svg viewBox="0 0 72 46">${svg}</svg>`;
}
// the move buttons are rebuilt only when they change, so a finger held on one (the preview) doesn't lose its click
let movesHTML = "";
function render() {
  const N = NODES[S.room], war = fight(), here = foesHere();
  const idle = !S.busy && !S.over;
  const pv = idle && S.preview && usable(S.preview) ? S.preview : null;
  const M = pv && MOVE[pv]();

  $("title").textContent = STR.room[S.room];
  $("turn").textContent = pad2(S.turn);
  $("turnBox").classList.toggle("hide", !war);
  $("turnBox").classList.toggle("foe", war && S.busy && !S.over);
  $("turnL").textContent = war && S.busy && !S.over ? STR.foes : STR.turn;
  $("goalN").textContent = `${S.goals.reduce((a, b) => a + b, 0)} / 3`;
  [...$("goals").children].forEach((li, i) => li.classList.toggle("done", !!S.goals[i]));

  const lose = war && idle ? Math.min(incoming(pv), S.hp) : 0;
  $("hp").textContent = S.hp; $("hpMax").textContent = S.max;
  bar($("hpTrail"), $("hpBar"), $("hpGhost"), S.hp, S.max, lose);
  $("inc").hidden = !lose; $("inc").textContent = "−" + lose;
  const spend = M ? M.vita : 0;
  $("vita").textContent = S.vita; $("vitaMax").textContent = S.vitaMax;
  $("pips").innerHTML = Array.from({ length: S.vitaMax }, (_, i) => `<i class="${i < S.vita - spend ? "on" : i < S.vita ? "on spend" : ""}"></i>`).join("");

  for (const k of here) {
    const F = FOE[k], f = S.foes[k], u = UI[k], mv = intent(k);
    if (!u) continue;
    const hitFor = pv === "strike" && S.target === k ? Math.min(DEF[S.hand].dmg, f.hp)
      : pv === "reflex" && S.target === k && counters(k) ? Math.min(DEF[S.hand].dmg * 2, f.hp) : 0;
    u.hp.textContent = f.hp;
    bar(u.trail, u.bar, u.ghost, f.hp, F.max, hitFor);
    u.chip.innerHTML = (mv.dmg ? ICON.bite : ICON.wait) + `<span>${intentText(mv)}</span>`;
    u.chip.classList.toggle("warn", mv.dmg >= 5 && !f.dodged);
    u.chip.classList.toggle("prep", !!mv.prep);
    u.chip.classList.toggle("miss", !!mv.dmg && (f.dodged || (pv === "reflex" && S.target === k && counters(k))));
    u.chip.classList.toggle("act", S.acting === k);
    u.label.classList.toggle("sel", S.target === k && !S.over);
    u.hit.disabled = S.over;
  }
  for (const k in OBJ) if (OUI[k]) {
    const on = usableObj(k);
    OUI[k].hit.disabled = !on || S.over;
    if (OUI[k].label) OUI[k].label.classList.toggle("gone", !on);
  }
  for (const d in OUI.doors || {}) OUI.doors[d].disabled = S.over || war;

  // the weapon in hand, then the four moves in a fight or the bag outside one
  $("wl").className = "wl" + (S.hand ? "" : " none");
  $("wl").innerHTML = S.hand ? `<img class="px" src="${ICON_URL[S.hand]}" alt="">${NAME(S.hand)}<em></em><span><i>${"★".repeat(DEF[S.hand].tier)}</i> · ${STR.level(1)}</span>`
    : `<span class="hand"></span>${STR.handEmpty}`;
  $("moves").hidden = !war; $("bagp").hidden = war; $("fleeRow").hidden = !war;
  const list = movesOf(S.hand);
  const html = [0, 1, 2, 3].map(i => {
    const m = list[i];
    if (!m) return `<button class="mv empty" disabled>${STR.empty}</button>`;
    const D = MOVE[m](), cls = !idle ? (m === "strike" ? "primary wait" : "wait") : !usable(m) ? "off" : m === "strike" ? "primary" : "";
    return `<button class="mv ${cls}" data-m="${m}"${/off|wait/.test(cls) ? ' aria-disabled="true"' : ""}><img class="px" src="${ICON_URL[D.icon]}" alt=""><span class="mt"><b>${D.name}</b><small>${D.sub}</small></span>${
      D.vita ? `<span class="cost"><i class="drop"></i>${D.vita}</span>` : ""}${S.newMoves.has(m) ? `<span class="newb">${STR.isNew}</span>` : ""}<kbd>${i + 1}</kbd></button>`;
  }).join("");
  if (html !== movesHTML) { $("moves").innerHTML = movesHTML = html; }
  $("flee").disabled = S.busy || S.over || !FLEE[S.room];
  $("flee").classList.toggle("hot", war && !list.length && idle);
  $("bagN").textContent = S.bag.length ? S.bag.reduce((a, b) => a + b.n, 0) : "";
  $("bag").innerHTML = S.bag.length ? S.bag.map(b => `<span class="cell${b.k === S.fresh ? " new" : ""}" title="${NAME(b.k)}">${itemImg(b.k)}${b.n > 1 ? `<b>${b.n}</b>` : ""}</span>`).join("")
    : `<span class="none">${STR.empty}</span>`;
  S.fresh = null;
  renderMap();
}
const ICON = {
  bite: '<svg viewBox="0 0 24 24"><polyline points="9.5 17.5 21 6 21 3 18 3 6.5 14.5"/><line x1="11" x2="5" y1="19" y2="13"/><line x1="8" x2="4" y1="16" y2="20"/></svg>',
  wait: '<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>'
};

let modalKind = null;
function openModal(title, html, kind) {
  modalKind = kind || null;
  $("mTitle").textContent = title; $("mBody").innerHTML = html; $("modal").hidden = false;
  ($("getUp") || $("mClose")).focus();
}
function closeModal() { $("modal").hidden = true; modalKind = null; }
function showChronicle() {
  const rows = S.log.length
    ? S.log.slice().reverse().map(l => `<div class="logl"><em>${pad2(l.turn)}</em><span>${l.text}</span></div>`).join("")
    : `<div class="logl"><span>${STR.nothingYet}</span></div>`;
  openModal(STR.log, rows);
}

/* ================= input ================= */
// a move: hover (mouse) or a held finger (touch) previews it on the bars, a tap or click plays it
$("moves").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b) act(b.dataset.m); });
$("moves").addEventListener("pointerover", e => { const b = e.target.closest("[data-m]"); if (b && S.preview !== b.dataset.m) { S.preview = b.dataset.m; render(); } });
$("moves").addEventListener("pointerdown", e => { const b = e.target.closest("[data-m]"); if (b && S.preview !== b.dataset.m) { S.preview = b.dataset.m; render(); } });
for (const t of ["pointerleave", "pointercancel"]) $("moves").addEventListener(t, () => { if (S.preview) { S.preview = null; render(); } });
$("flee").onclick = flee;
$("reset").onclick = reset;
$("chron").onclick = showChronicle;
$("mClose").onclick = () => ({ wake, fall: getUp, end: () => {} }[modalKind] || closeModal)();
$("modal").onclick = e => { if (e.target === $("modal") && (!modalKind || modalKind === "table")) closeModal(); };
$("goal").onclick = () => {
  const open = $("goals").hidden;
  $("goals").hidden = !open; $("goal").setAttribute("aria-expanded", open);
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modal").hidden && (!modalKind || modalKind === "table")) return closeModal();
  if (!$("modal").hidden) return;
  const m = movesOf(S.hand)[+e.key - 1];
  if (m) return act(m);
  const d = { ArrowUp: "N", ArrowDown: "S", ArrowLeft: "W", ArrowRight: "E" }[e.key];
  if (d) { e.preventDefault(); go(d); }
});

// in Telegram: the header matches the page, and Back leaves the run for the app
try { const tg = window.Telegram && window.Telegram.WebApp; if (tg && tg.initData) { tg.setHeaderColor("#111316"); tg.setBackgroundColor("#111316"); } } catch (e) {}
if (window.GY) window.GY.back(() => { location.href = "index.html"; });   // in Telegram, Back leaves the run for the app

reset();
requestAnimationFrame(frame);
</script>
