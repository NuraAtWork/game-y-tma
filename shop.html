<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tg.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0a0c}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
/* the Telegram build is always the phone layout: no device frame, no design notes */
.stage{display:block!important;height:100%!important;min-height:0!important;padding:0!important}
.device{width:100%!important;height:100%!important;aspect-ratio:auto!important;padding:0!important;border-radius:0!important;box-shadow:none!important}
.app{border-radius:0!important}
.statusbar,.homebar,.notes{display:none!important}
/* in full screen, stay clear of the phone's status bar and Telegram's own buttons */
:root{--tg-top:calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));--tg-bottom:var(--tg-safe-area-inset-bottom, 0px)}
.top{padding-top:calc(var(--tg-top) + 10px)!important}
.bottom{padding-bottom:calc(var(--tg-bottom) + 10px)!important}
.topbar{padding-top:calc(var(--tg-top) + 8px)!important}
.tabbar{padding-bottom:calc(var(--tg-bottom) + 8px)!important}
.sheet{padding-bottom:calc(var(--tg-bottom) + 16px)!important}
</style>
</head>
<body>
<title>Game Y Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: desktop = phone frame with design notes beside it; phone = the app itself, edge to edge.
   Shop = top bar (back · coins · crystals [+]) / the keeper's strip / four sections / bottom sheets for buying,
   the odds, the crystal packs and the Telegram payment stub. Same dark world and palette as the camp; sprites 16×16. */
:root{
  --stage:#0c0a0d;
  --bg:#141216;
  --panel:#201c22;
  --panel-hi:#29232b;
  --seg:#2c262d;
  --well:#0e0c10;
  --line:#3a3238;
  --fg:#ece3d2;
  --muted:#9d929a;
  --torch:#e2b24c;
  --torch-dim:#5b4524;
  --torch-ink:#1a1209;
  --blood:#cf4656;
  --blood-dim:#4a2229;
  --moss:#7fa48a;
  --moss-dim:#26332b;
  --arcane:#8f7ad1;
  --arcane-dim:#3a3150;
  --gem:#c9bdf2;
  --star:#f3d36b;
  --star-dim:#6a5a2a;
  --rare:#6fb3c2;
  --epic:#a98ff0;
  --g-common:rgba(157,146,154,.16);
  --g-uncommon:rgba(127,164,138,.26);
  --g-rare:rgba(111,179,194,.32);
  --g-epic:rgba(169,143,240,.42);
  --scrim:rgba(20,18,22,.95);
  --scrim-mid:rgba(20,18,22,.7);
  --veil:rgba(8,6,9,.6);
  --glow:rgba(226,178,76,.07);
  --glow-soft:rgba(226,178,76,.14);
  --pulse:rgba(226,178,76,.55);
  --pulse-0:rgba(226,178,76,0);
  --shadow:rgba(0,0,0,.5);
  --bezel:#050406;
  --bezel-edge:#2c262e;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{font-variant-ligatures:none!important}   /* Pixelify Sans turns "fl" into a broken glyph; !important because every font shorthand resets it */
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
img{image-rendering:pixelated}
:focus-visible{outline:2px solid var(--torch);outline-offset:2px}
.num{font-family:var(--body);font-variant-numeric:tabular-nums}   /* digits in Golos: Pixelify's small 2 and 5 read as 8 and S */

/* ---------- stage & device (same as the other states) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:radial-gradient(60% 55% at 50% 45%, var(--glow), transparent 70%)}
.device{position:relative;flex:none;height:clamp(640px, calc(100vh - 48px), 864px);height:clamp(640px, calc(100dvh - 48px), 864px);aspect-ratio:410/864;padding:10px;border-radius:58px;background:var(--bezel);box-shadow:0 0 0 1px var(--bezel-edge), 0 40px 90px -30px var(--bezel)}
.app{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.statusbar{flex:none;position:relative;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 36px;font:600 15px/1 var(--body);color:var(--fg)}
.island{position:absolute;top:11px;left:50%;width:118px;height:33px;margin-left:-59px;border-radius:17px;background:var(--bezel)}
.sys{display:flex;gap:6px;align-items:center}
.sys svg{display:block}
.homebar{position:absolute;bottom:8px;left:50%;z-index:30;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.75;pointer-events:none}

/* ---------- top bar: back · title · coins · crystals [+] ---------- */
.topbar{flex:none;padding-block:6px 10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--bg)}
.tb-sub{display:flex;align-items:center;gap:12px;min-height:42px}
.back{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.back .ico{width:16px;height:14px}
.tb-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tb-title b{font:500 18px/1.1 var(--display)}
.purse{flex:none;display:flex;align-items:center;gap:6px}
.chip{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 7px;border-radius:15px;background:var(--panel);border:1px solid var(--line);font:600 14px/1 var(--body);font-variant-numeric:tabular-nums}
.chip img{width:16px;height:16px}
.chip.coins{color:var(--torch)}
.chip.gems{padding-right:3px;color:var(--gem);cursor:pointer}
.chip .plus{width:22px;height:22px;display:grid;place-items:center;margin-left:3px;border-radius:11px;background:var(--arcane);color:var(--torch-ink)}
.chip .plus .ico{width:8px;height:8px}
.chip.bump{animation:bump .4s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- view ---------- */
.main{position:relative;flex:1;min-height:0;display:flex}
.views{position:relative;flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.views::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:12px;padding-block:16px 24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.pane{display:flex;flex-direction:column;gap:12px}
.pane.in{animation:fwd .2s ease-out}
@keyframes fwd{from{opacity:.3;transform:translateX(10px)}to{opacity:1;transform:none}}
.sec{margin:8px 0 0;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cap{margin:-4px 0 0;font-size:13px;color:var(--muted)}
.ico{display:block;flex:none;background:currentColor;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.narr{margin:-4px 0 0;font-size:14px;font-style:italic;color:var(--muted)}
.eyebrow{font:500 11px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;padding:2px 5px;border:1px dashed var(--muted);border-radius:3px;font:500 10px/1.2 var(--display);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 18px;border:0;border-radius:4px;background:var(--torch);color:var(--torch-ink);font:500 17px/1 var(--display);cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:15px}
.btn.ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn[disabled]{opacity:.45;cursor:default}
.btn img{width:16px;height:16px}
.btn .num{font-weight:600}
.btn .ico{width:10px;height:10px}
.btn:active,.row:active,.price:active,.chip.gems:active,.back:active,.seg button:active{transform:translateY(1px)}
.btn[disabled]:active,.price[disabled]:active{transform:none}
.linkbtn{padding:0;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- the keeper's strip (pixel art, 3 screen px per art px) ---------- */
.strip{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;width:100%;min-height:132px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;background-color:var(--panel);background-repeat:no-repeat;background-position:right bottom;image-rendering:pixelated;overflow:hidden}
.strip::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, var(--scrim) 0%, var(--scrim) 22%, var(--scrim-mid) 40%, transparent 62%)}
.strip>*{position:relative}
.strip .title{font:700 25px/1.05 var(--display);margin-top:2px}
.strip .draft{position:absolute;top:10px;left:12px}

/* ---------- four sections ---------- */
.seg{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--panel);box-shadow:0 0 0 6px var(--bg)}
.seg button{position:relative;display:flex;align-items:center;justify-content:center;padding:9px 0;border:0;border-radius:4px;background:transparent;color:var(--muted);font:500 14px/1 var(--display);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel-hi);color:var(--torch)}
.seg .dot{position:absolute;top:5px;right:6px;width:5px;height:5px;background:var(--torch)}

/* ---------- cards ---------- */
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gift{justify-content:space-between}
.gift .btn{width:100%}
.gift.done{background:transparent;border-style:dashed}
.gift.done .gives{opacity:.5}
.when{min-height:34px;display:flex;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gives{display:flex;flex-wrap:wrap;gap:6px}
.give{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:4px 9px 4px 6px;border-radius:4px;background:var(--seg);font:600 15px/1 var(--body);font-variant-numeric:tabular-nums}
.give img{width:28px;height:28px}
.give i{font-style:normal;font-weight:500;color:var(--muted)}
.feat{gap:12px;border-color:var(--star-dim);box-shadow:inset 0 0 0 1px var(--star-dim);background:radial-gradient(80% 90% at 85% 0%, var(--glow-soft), transparent 70%), var(--panel)}
.feat.offer{border-color:var(--blood-dim);box-shadow:inset 0 0 0 1px var(--blood-dim)}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.fhead div{display:flex;flex-direction:column;gap:5px;min-width:0}
.ftitle{font:700 22px/1.05 var(--display)}
.feat .eyebrow{color:var(--star)}
.feat.offer .eyebrow{color:var(--blood)}
.timer{flex:none;padding:5px 7px;border-radius:3px;background:var(--seg);font:500 13px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--torch)}
.frow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.off{padding:2px 5px;border-radius:3px;background:var(--blood);color:var(--fg);font:600 11px/1.2 var(--body);font-style:normal;font-variant-numeric:tabular-nums}

/* prices: Stars gold, crystals violet, coins torch */
.price{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--seg);color:var(--fg);font:600 15px/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
button.price{cursor:pointer}
.price img{width:16px;height:16px}
.price.stars{border-color:var(--star-dim);color:var(--star)}
.price.gems{border-color:var(--arcane-dim);color:var(--gem)}
.price.coins{border-color:var(--torch-dim);color:var(--torch)}
.price[disabled]{opacity:.45;cursor:default}
.price .x{font-weight:500;color:var(--muted)}

/* rows: heroes, bundles, supplies; the whole row opens the buy sheet */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);text-align:left;cursor:pointer}
.row.dim{background:transparent;border-style:dashed}
.row.dim .face img{opacity:.55}
.face{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:4px;background:var(--seg)}
.face img{width:32px;height:32px}
.rbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.rbody b{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:500 16px/1.15 var(--display)}
.line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;color:var(--muted)}
.line .it{display:inline-flex;align-items:center;gap:3px;color:var(--fg);font-variant-numeric:tabular-nums}
.line .it img{width:18px;height:18px}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border-radius:3px;font:500 12px/1 var(--display);letter-spacing:.06em;white-space:nowrap}
.pill .ico{width:8px;height:8px}
.pill.ok{background:var(--moss-dim);color:var(--moss)}
.pill.off{background:var(--seg);color:var(--muted)}

/* chests */
.chest{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.chest .pic{width:72px;height:72px;display:grid;place-items:center;border-radius:4px;background:radial-gradient(60% 60% at 50% 55%, var(--glow-soft), transparent 75%), var(--well)}
.chest.parts .pic{background:radial-gradient(60% 60% at 50% 55%, var(--g-epic), transparent 75%), var(--well)}
.chest .pic img{width:64px;height:64px}
.cbody{min-width:0;display:flex;flex-direction:column;gap:6px}
.cbody b{font:500 19px/1.1 var(--display)}
.cbody span{font-size:13px;color:var(--muted)}
.cbody .num{color:var(--fg);font-weight:600}
.meter{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;max-width:160px}
.meter i{height:6px;border-radius:1px;background:var(--seg)}
.meter i.on{background:var(--rare)}
.meter i.next{background:var(--epic)}
.chest .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chest .acts .linkbtn{margin-left:auto}
.region{display:flex;gap:12px;align-items:center;padding:16px 14px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.region .ico{width:16px;height:16px}
.region b{font:500 16px/1.15 var(--display)}

/* rarity */
.r-common{--rc:var(--muted);--rg:var(--g-common)}
.r-uncommon{--rc:var(--moss);--rg:var(--g-uncommon)}
.r-rare{--rc:var(--rare);--rg:var(--g-rare)}
.r-epic{--rc:var(--epic);--rg:var(--g-epic)}
.rtext{color:var(--rc)}

/* ---------- toast, sheet ---------- */
.toast{position:absolute;left:16px;right:16px;top:10px;z-index:30;padding:11px 14px;border:1px solid var(--line);border-left-width:4px;border-radius:6px;background:var(--panel-hi);font:500 14px/1.25 var(--body);box-shadow:0 10px 30px var(--bezel);pointer-events:none;animation:toast .2s ease-out}
.toast.recipe{border-left-color:var(--torch)}
.toast.almanac{border-left-color:var(--arcane)}
.toast.unlock{border-left-color:var(--moss)}
.toast.stub{border-style:dashed;border-left-style:solid;color:var(--muted)}
@keyframes toast{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.backdrop{position:absolute;inset:0;z-index:20;background:var(--veil)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding-block:8px 30px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0}
.sheet.in{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{flex:none;width:40px;height:4px;margin:0 auto 2px;border-radius:2px;background:var(--line)}
.plinth{position:relative;flex:none;height:140px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:radial-gradient(55% 60% at 50% 50%, var(--glow-soft), transparent 72%), var(--well)}
.plinth::after{content:"";position:absolute;left:50%;bottom:18px;width:84px;height:10px;margin-left:-42px;border-radius:50%;background:var(--shadow)}
.plinth>img{position:relative;z-index:1;width:96px;height:96px}
.plinth.lit{background:radial-gradient(55% 65% at 50% 50%, var(--rg), transparent 75%), var(--well);border-color:var(--rc)}
.plinth .box.shake{animation:rattle .65s linear}
@keyframes rattle{0%,100%{transform:none}12%{transform:translateX(-4px) rotate(-4deg)}25%{transform:translateX(4px) rotate(4deg)}38%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(3px) rotate(3deg)}62%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(2px) rotate(2deg)}88%{transform:translateX(-1px)}}
.plinth.reveal{height:180px}
.plinth.reveal .box{margin-top:48px}
.plinth .loot{position:absolute;z-index:2;left:50%;top:10px;width:48px;height:48px;margin-left:-24px;filter:drop-shadow(0 0 8px var(--rc));animation:rise .45s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.4)}to{opacity:1;transform:none}}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.sh-title b{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:500 21px/1.1 var(--display);color:var(--torch)}
.sh-title span{font-size:12px;color:var(--muted)}
.desc{margin:0;font-size:14px;color:var(--muted)}
.facts{margin:0;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.facts div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.facts div+div{border-top:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;display:flex;align-items:center;gap:5px;font:600 15px/1.2 var(--body);font-variant-numeric:tabular-nums}
.facts dd img{width:16px;height:16px}
.facts dd.short{color:var(--blood)}
.facts .rtext{font:500 15px/1 var(--display);color:var(--rc)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1}
.lockrow{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.lockrow .ico{width:14px;height:14px}
.lockrow b{font:500 15px/1.15 var(--display)}
.okrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--moss-dim);border-radius:6px;background:var(--panel)}
.okrow b{font:500 16px/1 var(--display);color:var(--moss)}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.lrow img{width:32px;height:32px}
.lrow b{font:500 15px/1.15 var(--display)}
.lrow span{font:600 14px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}

/* a chest opening: one find under the chest, or ten in a grid */
.drop1{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 0}
.drop1 b{font:500 19px/1.1 var(--display)}
.drop1 .pill{background:var(--seg);color:var(--rc)}
.drops{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.drop{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border:1px solid var(--line);border-bottom:3px solid var(--rc);border-radius:4px;background:var(--panel);animation:pop .3s ease-out both}
.drop img{width:32px;height:32px}
.drop span{font-size:11px;line-height:1.15;text-align:center;text-wrap:balance}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.8)}to{opacity:1;transform:none}}
.wait{visibility:hidden}
.wait *{animation:none!important}

/* crystal packs */
.packs{display:flex;flex-direction:column;gap:8px}
.pack{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.pack.best{border-color:var(--arcane);box-shadow:inset 0 0 0 1px var(--arcane)}
.pack>img{width:32px;height:32px}
.pk{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pk b{font:600 18px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--gem)}
.bonus{padding:3px 5px;border-radius:3px;background:var(--moss-dim);color:var(--moss);font:600 11px/1 var(--body);font-style:normal}
.bestv{padding:3px 5px;border-radius:3px;background:var(--arcane);color:var(--torch-ink);font:500 11px/1 var(--display);font-style:normal;letter-spacing:.06em;text-transform:uppercase}

/* ---------- notes beside the phone ---------- */
.notes{display:none;flex:0 1 300px;max-width:300px;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin;flex-direction:column;gap:22px}
.brand{font:700 34px/1 var(--display);color:var(--torch)}
.lede{margin:8px 0 0;font-size:15px;color:var(--muted)}
.note h3{margin:0 0 8px;font:500 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.note p{margin:0;font-size:14px}
.note a{color:var(--torch);text-underline-offset:3px}
.note code{font-size:12px;color:var(--muted)}
.note .cur{color:var(--fg)}
.dev{padding:2px 7px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--torch);font-size:13px;cursor:pointer}
.dev[aria-pressed="true"]{border-color:var(--torch)}
.foot{margin:0;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (min-width:1000px){.notes{display:flex}}

/* ---------- on a real phone: no frame ---------- */
@media (max-width:599px){
  body{background:var(--bg)}
  .stage{display:block;height:100%;min-height:0;padding:0;background:var(--bg)}
  .device{width:100%;height:100%;aspect-ratio:auto;padding:0;border-radius:0;background:var(--bg);box-shadow:none}
  .app{border-radius:0}
  .statusbar,.homebar{display:none}
  .topbar{padding-top:10px}
  .sheet{padding-bottom:16px}
}
@media (prefers-reduced-motion:reduce){.pane.in,.sheet.in,.toast,.chip.bump,.plinth .box.shake,.plinth .loot,.drop{animation:none}}

  const off = o.gives.gems ? Math.round((1 - o.stars / (o.gives.gems * GEM_PACKS[0].stars / GEM_PACKS[0].gems)) * 100) : 0;   // against the smallest pack
  return `<div class="card feat offer">
    <div class="fhead"><div><span class="eyebrow">${t("offer.eyebrow")}${off > 0 ? ` <i class="off">−${off}%</i>` : ""}</span><b class="ftitle">${t("offer." + o.id)}</b></div>${until(shop.offer.until, "clock", "timer")}</div>
    <div class="frow"><span class="gives">${givesHTML(o.gives)}</span>${priceBtn(o.sku)}</div>
  </div>`;
}

function paneFeatured() {
  const dDone = shop.daily === day(), aDone = shop.ad === day();
  const card = (label, gv, done, act) => `<div class="card gift${done ? " done" : ""}"><span class="eyebrow">${label}</span><span class="gives">${givesHTML(gv)}</span>${done ? until(midnight(), "next", "when") : act}</div>`;
  let h = `<h3 class="sec">${t("daily.sec")}</h3><div class="duo">
    ${card(t("daily.gift"), DAILY[dayNo() % DAILY.length], dDone, `<button class="btn sm" type="button" id="claim">${t("daily.claim")}</button>`)}
    ${card(t("daily.ad"), AD, aDone, `<button class="btn sm ghost" type="button" id="watch"${adBusy ? " disabled" : ""}>${adBusy ? "…" : ico("play", "", 2) + t("daily.watch")}</button>`)}
  </div>`;
  if (!blocked(STARTER.sku)) h += `<div class="card feat">
      <div class="fhead"><div><span class="eyebrow">${t("starter.eyebrow")}</span><b class="ftitle">${t("starter.title")}</b></div>${until(shop.starterUntil, "left", "timer")}</div>
      <div class="frow"><span class="gives">${givesHTML(STARTER.gives)}</span>${priceBtn(STARTER.sku)}</div>
    </div>`;
  const o = offerNow();
  if (o) h += offerCard(o);
  return h + `<h3 class="sec">${t("bundles.sec")}</h3><div class="rows">${CATALOG.bundles.map(b => rowHTML(b.sku)).join("")}</div>`;
}
function paneHeroes() {
  const rows = kind => `<div class="rows">${CATALOG.heroes.filter(h => h.kind === kind).map(h => rowHTML(h.sku)).join("")}</div>`;
  return `<h3 class="sec">${t("heroes.slots")}</h3><p class="cap">${t("heroes.slotsCap")}</p>${rows("slot")}
    <h3 class="sec">${t("heroes.races")}</h3>${rows("race")}
    <h3 class="sec">${t("heroes.subs")}</h3><p class="cap">${t("heroes.subsCap")}</p>${rows("sub")}
    <h3 class="sec">${t("heroes.classes")}</h3>${rows("class")}`;
}
function paneChests() {
  const p = PITY.parts, n = shop.pity.parts;
  const meter = `<span class="meter" style="--n:${p}" aria-hidden="true">${Array.from({ length: p }, (_, i) => `<i${i < n ? ' class="on"' : i === p - 1 ? ' class="next"' : ""}></i>`).join("")}</span>`;
  const off10 = Math.round((1 - CHESTS.parts.gems10 / (CHESTS.parts.gems * 10)) * 100);
  const parts = SHOP_FLAGS.paidChests ? `<div class="card chest parts">
      <span class="pic">${img("pchest")}</span>
      <div class="cbody"><b>${t("chests.parts")}</b><span>${t("chests.pity", { n: N(p - n) })}</span>${meter}</div>
      <div class="acts">${priceBtn("chest_parts", "×1")}${priceBtn("chest_parts10", "×10")}${off10 > 0 ? `<i class="off">−${off10}%</i>` : ""}<button class="linkbtn" type="button" data-odds="parts">${t("chests.odds")}</button></div>
    </div>` : `<div class="region">${ico("lock", "", 2)}<b>${t("chests.region")}</b></div>`;
  const used = shop.coinChest === day();
  const coin = `<div class="card chest">
      <span class="pic">${img(used ? "open" : "chest")}</span>
      <div class="cbody"><b>${t("chests.coin")}</b>${used ? until(midnight(), "next", "") : `<span>${t("chests.perDay")}</span>`}</div>
      <div class="acts">${priceBtn("chest_coin", "×1")}<button class="linkbtn" type="button" data-odds="coin">${t("chests.odds")}</button></div>
    </div>`;
  return parts + coin;
}
const paneSupplies = () => `<div class="rows">${CATALOG.supplies.map(s => rowHTML(s.sku)).join("")}</div>`;
const PANES = { featured: paneFeatured, heroes: paneHeroes, chests: paneChests, supplies: paneSupplies };

function renderSeg() {   // a dot: something free today
  const dot = { featured: shop.daily !== day() || shop.ad !== day(), chests: !blocked("chest_coin") && wallet.coins >= priceOf("chest_coin") };
  $("seg").innerHTML = TABS.map(k => `<button type="button" role="tab" data-seg="${k}" aria-selected="${k === tab}">${t("tab." + k)}${dot[k] ? '<i class="dot" aria-hidden="true"></i>' : ""}</button>`).join("");
}
function render(anim) {
  renderSeg();
  const p = $("pane");
  p.innerHTML = PANES[tab]();
  p.setAttribute("aria-label", t("tab." + tab));
  if (anim && !still) { p.classList.remove("in"); void p.offsetWidth; p.classList.add("in"); }
}
const viewsEl = $("views");
function setTab(k) {
  if (k === tab) return;
  tab = k;
  try { localStorage.setItem("gamey.tab.shop", k); } catch (e) {}
  render(true);
  const top = $("seg").offsetTop - 16; if (viewsEl.scrollTop > top) viewsEl.scrollTop = top;   // the new section starts under the tabs
}
const painted = {};
function paint() {   // the top bar's coins and crystals; a change makes the chip jump
  ["coins", "gems"].forEach(k => {
    const v = wallet[k];
    if (painted[k] != null && painted[k] !== v && !still) { const c = $(k); c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
    $(k + "N").textContent = v; painted[k] = v;
  });
  $("coins").setAttribute("aria-label", t("aria.coins", { n: wallet.coins }));
  $("gems").setAttribute("aria-label", t("aria.gems", { n: wallet.gems }));
}

/* ================= sheets ================= */
let lastFocus = null, pending = null, payDone = null, opening = 0;   // pending: a confirm sheet waiting for Buy; payDone: the Stars stub's answer
function openSheet(pic, title, sub, body, label) {
  const sh = $("sheet"), open = !sh.hidden;
  if (!open) lastFocus = document.activeElement;
  opening++;
  sh.innerHTML = `<div class="grab"></div>${pic ? `<div class="plinth" id="plinth">${pic}</div>` : ""}
    <div class="sh-head"><div class="sh-title"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</div><button class="btn ghost sm" type="button" data-close>${t("close")}</button></div>
    ${body}`;
  sh.setAttribute("aria-label", label || title);
  sh.hidden = $("backdrop").hidden = false;
  sh.scrollTop = 0;
  if (!open && !still) { sh.classList.remove("in"); void sh.offsetWidth; sh.classList.add("in"); }
  sh.querySelector("[data-close]").focus({ preventScroll: true });
  syncBack();
}
function cancelPending() { if (pending) { track("purchase_cancel", pending); pending = null; } }
function closeSheet() {
  cancelPending();
  if (payDone) { const d = payDone; payDone = null; d(false); }
  opening++;   // a chest still rattling stops here
  $("sheet").hidden = $("backdrop").hidden = true;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
  syncBack();
}
function openBuy(sku) {   // the detail and confirm sheet for crystals and coins: price, balance, balance after
  cancelPending();
  const g = GOODS[sku], why = blocked(sku), p = priceOf(sku), bal = wallet[g.cur], ok = !why && bal >= p;
  track("shop_item_view", { sku });
  let body = "";
  if (g.cat === "hero") body += `<p class="desc">${g.kind === "slot" ? t("heroes.slotsCap") : t("side")}${g.kind === "sub" ? ` ${t("heroes.subsCap")}.` : ""}</p>`;
  if (g.cat === "supply") body += `<p class="desc">${lineOf(sku)}</p>`;
  if (g.items) body += `<div class="list">${gotRows({ items: g.items, frame: g.frame })}</div>`;
  if (why === "owned") body += `<div class="okrow"><b>${t("owned")}</b></div>`;
  else if (why) body += `<div class="lockrow">${ico("lock", "", 2)}<b>${whyText(sku, why)}</b></div>`;
  else {
    body += `<dl class="facts"><div><dt>${t("buy.price")}</dt><dd>${cost(g.cur, p)}</dd></div>
      <div><dt>${t("buy.have")}</dt><dd${ok ? "" : ' class="short"'}>${cost(g.cur, bal)}</dd></div>
      ${ok ? `<div><dt>${t("buy.after")}</dt><dd>${cost(g.cur, bal - p)}</dd></div>` : ""}</dl>
      <div class="acts">${ok ? `<button class="btn" type="button" data-confirm="${sku}">${t("buy.buy")}</button>`
        : g.cur === "gems" ? `<button class="btn" type="button" data-low>${img("gem")}${t("buy.get")}</button>`
        : `<button class="btn" type="button" disabled>${t("buy.noCoins")}</button>`}</div>`;
  }
  openSheet(faceOf(sku), `${nameOf(sku)}${g.tbd ? ` <i class="tag">${t("tbd")}</i>` : ""}`, subOf(sku), body, nameOf(sku));
  if (ok) { pending = { sku, currency: g.cur, price: p }; track("purchase_start", pending); }
}
function openOdds(chest) {
  track("odds_view", { chest });
  const rows = Object.entries(CHESTS[chest].odds).map(([r, p]) => `<div class="r-${r}"><dt class="rtext">${t("rar." + r)}</dt><dd>${N(p + "%")}</dd></div>`).join("");
  openSheet(img(chest === "parts" ? "pchest" : "chest"), t("odds.title"), t("chests." + chest),
    `<dl class="facts">${rows}</dl>${PITY[chest] ? `<p class="desc">${t("odds.pity", { n: PITY[chest] })}</p>` : ""}<p class="desc">${t("odds.tower")}</p>`);
}
function openPacks(source, quiet) {   // from the + in the top bar, or on its own when crystals run short
  cancelPending();
  if (!quiet) track("shop_open", { tab: "gems", source });
  const o = offerNow(), base = GEM_PACKS[0].gems / GEM_PACKS[0].stars;
  const rows = GEM_PACKS.map(p => {
    const bonus = Math.round((p.gems / p.stars / base - 1) * 100);
    return `<div class="pack${p.best ? " best" : ""}">${img("gem")}<span class="pk"><b>${p.gems}</b>${bonus > 0 ? `<i class="bonus">${t("packs.bonus", { n: bonus })}</i>` : ""}${p.best ? `<i class="bestv">${t("packs.best")}</i>` : ""}</span>${priceBtn(p.sku)}</div>`;
  }).join("");
  openSheet("", t("packs.title"), t("packs.sub"), `${o && o.trigger === "low_gems" ? offerCard(o) : ""}<div class="packs">${rows}</div>`);
}
function lowGems() { if (trigger("low_gems")) render(); openPacks("low_gems"); }
function openGot(sku, got) { openSheet(img(sprOf(sku)), nameOf(sku), t("got.sub"), `<div class="list">${gotRows(got)}</div>`); }

/* ================= buying ================= */
function pay(sku) {   // every Stars purchase goes through here: in Telegram the platform layer's GY.pay (tools/tg.js), elsewhere the stub
  const stub = () => new Promise(done => paySheet(sku, done));
  return window.GY && window.GY.pay ? window.GY.pay(sku, stub) : stub();
}
function paySheet(sku, done) {   // stands in for Telegram's own invoice: Pay ★N / Cancel
  cancelPending();
  if (payDone) payDone(false);
  payDone = done;
  const g = GOODS[sku], p = priceOf(sku);
  openSheet(img("star"), `${t("pay.title")} <i class="tag">${t("stub")}</i>`, nameOf(sku),
    `<span class="gives">${givesHTML(g.cat === "pack" ? { gems: g.gems } : g.gives)}</span>
     <div class="acts"><button class="btn" type="button" data-pay>${t("pay.pay")} ${cost("stars", p)}</button><button class="btn ghost" type="button" data-close>${t("buy.cancel")}</button></div>`, t("pay.title"));
}
function grantStars(sku) {   // a pack gives crystals only; the starter and offers keep their contents with the purchase, for a refund (GDE-05)
  const g = GOODS[sku], rec = { sku, stars: g.price, t: Date.now() };
  let got;
  if (g.cat === "pack") got = grant({ gems: g.gems });
  else {
    got = grant(g.gives); rec.gives = got;
    if (g.cat === "starter") { shop.starterBought = true; shop.starterUntil = null; }
    if (g.cat === "offer") shop.offer = null;
  }
  shop.purchases.push(rec);
  return got;
}
function buyStars(sku) {
  if (blocked(sku)) return;
  cancelPending();
  const o = { sku, currency: "stars", price: priceOf(sku) };
  track("purchase_start", o);
  pay(sku).then(paid => {
    if (!paid) { track("purchase_cancel", o); return; }
    const before = snap(), got = grantStars(sku);
    persist(); track("purchase_success", o); haptic("ok"); paint(); render();
    openGot(sku, got); recipeToast(before);
  });
}
function tapBuy(sku, again) {   // a price button on a card; "again" after a chest skips the confirm, its price is on the button
  const g = GOODS[sku];
  if (g.cur === "stars") return buyStars(sku);
  if (blocked(sku)) return;
  const p = priceOf(sku);
  if (g.cur === "gems" && wallet.gems < p) return lowGems();
  if (again && wallet[g.cur] >= p) { cancelPending(); pending = { sku, currency: g.cur, price: p }; track("purchase_start", pending); return confirmBuy(sku); }
  openBuy(sku);
}
function confirmBuy(sku) {
  const g = GOODS[sku], p = priceOf(sku);
  if (blocked(sku) || wallet[g.cur] < p) return;
  const o = pending || { sku, currency: g.cur, price: p }; pending = null;
  wallet[g.cur] -= p;
  track("purchase_success", o);
  if (g.cat === "chest") { openChest(sku); paint(); render(); return; }
  const before = snap(); let got = null;
  if (g.cat === "hero") { shop.owned.push(sku); toast("unlock", g.kind === "slot" ? t("toast.slot", { n: g.n }) : t("toast." + g.kind, { name: nameOf(sku) })); }
  if (g.cat === "bundle") got = grant({ items: g.items, frame: g.frame });
  if (sku === "bag") { shop.bagX++; toast("unlock", t("toast.bag", { n: g.slots })); }
  else if (g.cat === "supply") shop.stock[sku] = (shop.stock[sku] | 0) + 1;
  persist(); haptic("ok"); paint(); render();
  if (got) { openGot(sku, got); recipeToast(before); } else closeSheet();
}
function openChest(sku) {   // the chest rattles, opens, and the find drops into the bag
  const g = GOODS[sku], c = g.chest, before = snap(), pityBefore = shop.pity[c] | 0;
  if (c === "coin") shop.coinChest = day();
  const drops = Array.from({ length: g.n }, () => roll(c));
  drops.forEach(d => give(d.key, 1));
  const best = drops.reduce((b, d) => RANK[d.rar] > RANK[b.rar] ? d : b);
  persist();
  track("chest_open", { chest: c, n: g.n, rarity: best.rar, pity_before: pityBefore });
  const lid = c === "parts" ? "popen" : "open";
  const found = drops.length > 1
    ? `<div class="drops wait">${drops.map((d, i) => `<span class="drop r-${d.rar}" style="animation-delay:${i * 60}ms">${img(item(d.key).spr)}<span>${item(d.key).name}</span></span>`).join("")}</div>`
    : `<div class="drop1 wait r-${best.rar}"><b>${item(best.key).name}</b><span class="pill">${t("rar." + best.rar)}</span></div>`;
  const again = blocked(sku) ? "" : `<div class="acts"><button class="btn" type="button" data-again="${sku}">${t("buy.again")} ${cost(g.cur, priceOf(sku))}</button></div>`;
  openSheet(`<img class="box${still ? "" : " shake"}" src="${sprURL(sprOf(sku))}" alt=""><img class="loot" src="${sprURL(item(best.key).spr)}" alt="" hidden>`,
    nameOf(sku), t("got.bag"), found + again);
  $("plinth").classList.add("reveal");   // room above the chest for the find to rise into
  const token = opening;
  setTimeout(() => {
    recipeToast(before);
    const pl = $("plinth");
    if (token !== opening || !pl) return;
    const box = pl.querySelector(".box");
    pl.classList.add("lit", "r-" + best.rar);
    box.src = sprURL(lid); box.classList.remove("shake");
    pl.querySelector(".loot").hidden = false;
    $("sheet").querySelectorAll(".wait").forEach(el => el.classList.remove("wait"));
    haptic(RANK[best.rar] >= RANK.rare ? "ok" : "light");
  }, still ? 0 : 650);
}

/* ================= daily: a gift and an ad, once per local day each ================= */
const rewardTag = gv => [gv.gems && `gems:${gv.gems}`, gv.coins && `coins:${gv.coins}`, ...(gv.items || []).map(([k, n]) => `${k}:${n}`)].filter(Boolean).join(",");
function claimDaily() {
  if (shop.daily === day()) return;
  const r = DAILY[dayNo() % DAILY.length], before = snap();
  grant(r); shop.daily = day(); persist();
  track("daily_claim", { reward: rewardTag(r) });
  haptic("ok"); paint(); render(); recipeToast(before);
}
function watchAd() {
  if (shop.ad === day() || adBusy) return;
  adBusy = true; toast("stub", t("stub.ad")); render();
  setTimeout(() => {
    adBusy = false;
    const before = snap();
    grant(AD); shop.ad = day(); persist();
    track("ad_claim", { reward: rewardTag(AD) });
    haptic("ok"); paint(); render(); recipeToast(before);
  }, still ? 300 : 1500);
}

/* ================= navigation and input ================= */
const goHome = () => { location.href = HOME; };
function syncBack() {   // Telegram's own back button: a sheet first, then home
  if (window.GY) window.GY.back($("sheet").hidden ? goHome : closeSheet);
}
document.addEventListener("click", e => {
  const el = e.target.closest("button"); if (!el || el.disabled) return;
  const d = el.dataset;
  if (d.seg) setTab(d.seg);
  else if (el.id === "claim") claimDaily();
  else if (el.id === "watch") watchAd();
  else if (d.buy) tapBuy(d.buy);
  else if (d.again) tapBuy(d.again, true);
  else if (d.sku) openBuy(d.sku);
  else if (d.confirm) confirmBuy(d.confirm);
  else if (d.odds) openOdds(d.odds);
  else if ("low" in d) lowGems();
  else if ("pay" in d) { const done = payDone; payDone = null; if (done) done(true); }
  else if ("close" in d) closeSheet();
  else if (el.id === "gems") openPacks("topbar_plus");
  else if (el.id === "back") goHome();
  else if (d.dev) dev(d.dev, el);
});
$("backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

let today0 = day();
setInterval(() => {   // timers tick; one that runs out, or a new day, redraws the section
  let gone = false;
  document.querySelectorAll("[data-until]").forEach(el => {
    const ms = +el.dataset.until - Date.now();
    if (ms > 0) { el.textContent = FMT[el.dataset.fmt](ms); return; }
    el.removeAttribute("data-until"); gone = true;
  });
  if (gone || day() !== today0) { today0 = day(); if (shop.offer && !offerNow()) { shop.offer = null; persist(true); } render(); }
}, 1000);

/* ================= design-notes helpers (the Telegram build drops the notes) ================= */
function noteSource() {
  const n = $("srcNote"); if (!n) return;
  n.innerHTML = demo ? "Сейчас: демо — 600 монет и 400 кристаллов, <code>gamey.save</code> нет; запишется при первой покупке." : "Сейчас: <code>gamey.save</code>, поля <code>wallet</code> и <code>shop</code>.";
}
function dev(k, el) {
  if (k === "coins") wallet.coins += 500;
  if (k === "gems") wallet.gems += 500;
  if (k === "zero") wallet.coins = wallet.gems = 0;
  if (k === "day") shop.daily = shop.ad = shop.coinChest = null;
  if (k === "pity") shop.pity.parts = PITY.parts - 1;
  if (k === "crown") { devCrown = !devCrown; el.setAttribute("aria-pressed", String(devCrown)); }
  if (k === "reset") {
    save.shop = shopOf(null);
    try { const a = readJSON("gamey.once", []); localStorage.setItem("gamey.once", JSON.stringify((Array.isArray(a) ? a : []).filter(x => x !== "narrate.shop:first"))); localStorage.removeItem("gamey.tab.shop"); } catch (e) {}
    if (!demo) writeJSON("gamey.save", save);
    location.reload(); return;
  }
  if (k !== "crown") persist();
  paint(); render();
}

/* ================= init ================= */
const qOffer = Q.get("offer");
if (!shop.starterBought && !shop.starterUntil) { shop.starterUntil = Date.now() + STARTER.hours * 36e5; persist(true); }   // the starter's clock starts at the first visit
if (qOffer && trigger(qOffer, true)) tab = "featured";
if (shop.offer && !offerNow()) shop.offer = null;
$("draft").hidden = !PRICES_DRAFT;
const sc = $("scene"); paintStrip(sc); if (ro) ro.observe(sc);
narrate("shop:first", t("narr.first"), sc);
paint(); render(); noteSource(); syncBack();
const from = Q.has("gems") ? "topbar_plus" : qOffer ? "offer" : /01-first|index\.html/.test(document.referrer) ? "tab" : "direct";
track("shop_open", { tab, source: from });
if (Q.has("gems")) openPacks("topbar_plus", true);
})();
</script>
